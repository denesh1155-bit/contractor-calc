# Cloudflare Pages Configuration
# ════════════════════════════════════════════════
# This file tells Cloudflare Pages how to build and deploy the project.
# For a pure HTML/CSS/JS static site, NO build step is needed.
# The publish directory is the root folder itself.
# ════════════════════════════════════════════════
[build]
  # No build command needed — pure static HTML/JS/CSS
  command = ""
  # The folder to publish (root = current directory)
  publish = "."

[build.environment]
  # Node version (optional, not used but good practice to pin)
  NODE_VERSION = "20"

# ── Custom Headers ──────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers — improve SEO and protection
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/style.css"
  [headers.values]
    # Cache CSS aggressively (1 year)
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app.js"
  [headers.values]
    # Cache JS aggressively (1 year)
    Cache-Control = "public, max-age=31536000, immutable"

# ── Redirects ────────────────────────────────────
# Uncomment and customize when your domain is connected:
# [[redirects]]
#   from = "http://contractorcalc.pro/*"
#   to   = "https://contractorcalc.pro/:splat"
#   status = 301
