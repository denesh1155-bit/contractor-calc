<title>ქართული ზღაპრები</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700&family=Noto+Serif+Georgian:wght@600;800&display=swap">
<style>
/* Layout: phone-first storybook — mode switch, shelves of picture tiles by category, full-screen player where the living picture fills the whole screen and controls float on top */
:root {
  --page: #131938;
  --page-glow: #2d3a7a;
  --card: #1c2450;
  --ink: #f7efe0;
  --muted: #a9aed6;
  --moon: #ffd98a;
  --on-moon: #131938;
  --line: rgba(247, 239, 224, .14);
  --display: "Noto Serif Georgian", "Sylfaen", Georgia, serif;
  --body: "Noto Sans Georgian", "Sylfaen", system-ui, sans-serif;
  color-scheme: dark;
}
:root.day {
  --page: #dff1ff;
  --page-glow: #fff3d6;
  --card: #ffffff;
  --ink: #23305a;
  --muted: #5f6b94;
  --moon: #ff9f43;
  --on-moon: #ffffff;
  --line: rgba(35, 48, 90, .14);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 70% at 80% -10%, var(--page-glow) 0%, var(--page) 55%) fixed, var(--page);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--moon); outline-offset: 3px; }

.wrap {
  max-width: 560px; margin: 0 auto;
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: 1.45rem; line-height: 1.2; margin: 0; text-wrap: balance; }
.brand svg { flex: none; }
.parent-btn { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: .8rem; }

.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; border-radius: 22px; background: var(--card); margin-bottom: 22px; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
.modes button { display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: 16px; font-weight: 700; font-size: .95rem; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--moon); color: var(--on-moon); }

.shelf { margin-bottom: 26px; }
.shelf h2 { font-family: var(--display); font-weight: 800; font-size: 1.15rem; margin: 0 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.shelf h2 small { font-family: var(--body); font-weight: 400; font-size: .78rem; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.tile { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 0; text-align: left; transition: transform .15s ease; }
.tile:active { transform: scale(.96); }
.tile .art { aspect-ratio: 1 / 1; max-width: 100%; border-radius: 22px; overflow: hidden; box-shadow: 0 10px 24px rgba(0,0,0,.25); }
.tile .art svg { display: block; width: 100%; height: 100%; }
.tile .name { font-family: var(--display); font-weight: 600; font-size: 1rem; line-height: 1.3; padding-inline: 4px; }
.tile .len { padding-inline: 4px; font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile.locked .art { filter: saturate(.6) brightness(.82); }
.badge { position: absolute; top: 10px; right: 10px; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: rgba(19, 25, 56, .7); }
.badge.free { width: auto; padding: 0 10px; border-radius: 999px; height: 28px; font-size: .72rem; font-weight: 700; color: #131938; background: #ffd98a; }
.weekly { margin-top: 4px; padding: 14px 16px; border-radius: 18px; border: 1px dashed var(--line); color: var(--muted); font-size: .9rem; line-height: 1.5; }
.still * { animation-play-state: paused !important; }

/* ---------- full-screen player: the picture is the whole screen ---------- */
.player { position: fixed; inset: 0; z-index: 20; background: #131938; overflow: hidden; }
.stage { position: absolute; inset: 0; }
.stage .layer { position: absolute; inset: 0; transition: opacity 1s ease; }
.stage .layer.in { animation: sceneIn 1.4s ease-out both; }
.stage .layer svg { display: block; width: 100%; height: 100%; overflow: visible; }
.stage .layer svg > .cam { animation: cam 18s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 50% 50%; }
.player-top {
  position: absolute; z-index: 2; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.round { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: rgba(19, 25, 56, .45); color: #fff; backdrop-filter: blur(6px); }
.controls {
  position: absolute; z-index: 2; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding-top: 70px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, rgba(10, 12, 30, .72), rgba(10, 12, 30, 0));
  color: #fff;
}
.controls > * { width: 100%; max-width: 460px; }
.controls h2 { font-family: var(--display); font-weight: 800; font-size: 1.5rem; margin: 0; text-align: center; text-wrap: balance; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
.bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.25); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: #ffd98a; border-radius: inherit; }
.times { display: flex; justify-content: space-between; font-size: .8rem; font-variant-numeric: tabular-nums; margin-top: -8px; opacity: .85; }
.play { width: 88px !important; height: 88px; border-radius: 50%; display: grid; place-items: center; background: #ffd98a; color: #131938; box-shadow: 0 0 0 9px rgba(255, 217, 138, .22), 0 6px 30px rgba(0,0,0,.35); }
.play:active { transform: scale(.95); }
.sleep-hint { font-size: .8rem; text-align: center; opacity: .8; }

.night { position: fixed; inset: 0; z-index: 30; background: #04050d; display: grid; place-items: center; color: #3b4170; font-size: .85rem; text-align: center; padding: 24px; }
.night .z { font-family: var(--display); font-size: 2rem; opacity: .6; animation: breathe 4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .2; } }

/* ---------- living-picture motions ---------- */
.eye, .ears, .tail, .sway, .twinkle, .glow, .flap, .neck, .nod, .breathe, .sad, .idle, .arm, .flicker, .roar, .dance, .sit, .wings, .laugh, .bob, .hop { transform-box: fill-box; }
.eye { transform-origin: center; animation: blink 4.5s infinite; }
.ears { transform-origin: 50% 100%; animation: wiggle 2.6s ease-in-out infinite; }
.tail { transform-origin: 80% 100%; animation: wag 1s ease-in-out infinite alternate; }
.sway { transform-origin: 50% 100%; animation: sway 3s ease-in-out infinite alternate; }
.cloud { animation: drift 30s linear infinite; }
.spin { animation: spin 24s linear infinite; }
.twinkle { transform-origin: center; animation: twinkle 2.2s ease-in-out infinite; }
.glow { transform-origin: center; animation: glow 2.6s ease-in-out infinite alternate; }
.flap { transform-origin: 0 50%; animation: flap .7s ease-in-out infinite alternate; }
.zf { animation: zf 3s ease-out infinite; }
.neck { transform-origin: 50% 100%; }
.wind { animation: windgo 4s linear infinite; }
.flicker { transform-origin: 50% 100%; animation: flicker .45s ease-in-out infinite alternate; }
.drip { animation: drip 1.1s ease-in infinite; }
.fall { animation: fall 6s linear infinite; }
.flyaway { animation: flyaway 4.5s ease-in .8s both; }
.flutter { animation: flutter 10s ease-in-out infinite; }
.wings { transform-origin: 50% 50%; animation: wingflap .22s ease-in-out infinite alternate; }
.flyby { animation: flyby 14s linear infinite; }
.firefly { animation: firefly 7s ease-in-out infinite; }
.shoot { animation: shoot 9s ease-in infinite; }

.idle { transform-origin: 50% 100%; animation: breath 3.2s ease-in-out infinite; }
.bob { transform-origin: 50% 100%; animation: bob 1.1s ease-in-out infinite; }
.hop { transform-origin: 50% 100%; animation: hop .9s ease-in-out infinite; }
.laugh { transform-origin: 50% 100%; animation: laugh .4s ease-in-out infinite; }
.nod { transform-origin: 50% 100%; animation: nod 1.8s ease-in-out infinite; }
.breathe { transform-origin: 50% 100%; animation: breath 3.6s ease-in-out infinite; }
.run { animation: run 3.2s ease-in .4s both; }
.runin { animation: runin 6s ease-out both; }
.walk { animation: walk 14s linear both; }
.walk > * { animation: step .5s ease-in-out infinite; }
@keyframes step { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.sad { transform-origin: 50% 100%; animation: sad 2.4s ease-in-out infinite alternate; }
.sad .neck, .drink .neck { animation: dip 2.2s ease-in-out infinite; }
.lick { animation: lick .5s ease-in-out infinite alternate; }
.rise { animation: rise 2.2s ease-out both; }
.appear { animation: appear 2s ease-out both; }
.roar { transform-origin: 50% 100%; animation: roar 1.6s ease-in-out infinite; }
.stomp { animation: stomp 1.3s ease-in-out infinite; }
.shiver { animation: shiver .22s linear infinite; }
.dance { transform-origin: 50% 100%; animation: dance .7s ease-in-out infinite alternate; }
.sit { transform-origin: 50% 100%; animation: sitdown 1.6s ease-out both; }
.leave { animation: leave 14s ease-in 1s both; }
.poke .arm { transform-origin: 30% 10%; animation: poke .9s ease-in-out infinite alternate; }
.throw .arm { transform-origin: 30% 10%; animation: throwArm 4.5s ease-in-out .3s both; }
.squeeze .arm { transform-origin: 30% 10%; animation: squeeze 1.1s ease-in-out infinite; }
.wave .arm { transform-origin: 30% 10%; animation: waveArm .8s ease-in-out infinite alternate; }

@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@keyframes wiggle { 0%, 60%, 100% { transform: rotate(0); } 72% { transform: rotate(-10deg); } 86% { transform: rotate(7deg); } }
@keyframes wag { from { transform: rotate(-10deg); } to { transform: rotate(12deg); } }
@keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
@keyframes drift { from { transform: translateX(-90px); } to { transform: translateX(260px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes twinkle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .25; transform: scale(.55); } }
@keyframes glow { from { filter: drop-shadow(0 0 2px #ffd98a); } to { filter: drop-shadow(0 0 12px #ffd98a); } }
@keyframes flap { from { transform: skewY(0); } to { transform: skewY(-10deg) scaleX(.88); } }
@keyframes zf { 0% { transform: translate(0, 0); opacity: 0; } 20% { opacity: .95; } 100% { transform: translate(14px, -30px); opacity: 0; } }
@keyframes windgo { from { transform: translateX(-120px); opacity: 0; } 30% { opacity: .8; } to { transform: translateX(230px); opacity: 0; } }
@keyframes flicker { from { transform: scale(.92, .86) skewX(-3deg); } to { transform: scale(1.04, 1.1) skewX(3deg); } }
@keyframes drip { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(26px); opacity: 0; } }
@keyframes fall { 0% { transform: translate(0, -60px) rotate(0); opacity: 0; } 10% { opacity: 1; } 50% { transform: translate(18px, 60px) rotate(180deg); } 100% { transform: translate(-6px, 190px) rotate(360deg); opacity: 0; } }
@keyframes flyaway { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(110px, -190px) scale(.35); opacity: .6; } }
@keyframes flutter { 0%, 100% { transform: translate(0, 0); } 20% { transform: translate(40px, -26px); } 45% { transform: translate(90px, 4px); } 70% { transform: translate(50px, 30px); } 85% { transform: translate(10px, 12px); } }
@keyframes wingflap { from { transform: scaleX(1); } to { transform: scaleX(.25); } }
@keyframes flyby { 0% { transform: translate(-60px, 0); } 25% { transform: translate(10px, -8px); } 50% { transform: translate(80px, 4px); } 75% { transform: translate(150px, -6px); } 100% { transform: translate(260px, 2px); } }
@keyframes firefly { 0%, 100% { transform: translate(0, 0); opacity: .2; } 25% { transform: translate(14px, -10px); opacity: 1; } 50% { transform: translate(26px, 6px); opacity: .4; } 75% { transform: translate(8px, 14px); opacity: 1; } }
@keyframes shoot { 0%, 82% { transform: translate(0, 0); opacity: 0; } 85% { opacity: 1; } 100% { transform: translate(-130px, 70px); opacity: 0; } }
@keyframes bob { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-5px) scale(.98, 1.03); } }
@keyframes hop { 0%, 100% { transform: translateY(0) scale(1.04, .96); } 15% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-16px) scale(.97, 1.04); } 85% { transform: translateY(0) scale(1, 1); } }
@keyframes laugh { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-4px) rotate(3deg); } }
@keyframes nod { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(4deg); } 60% { transform: rotate(-2deg); } }
@keyframes breath { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.025, 1.05); } }
@keyframes run { 0% { transform: translateX(0); } 15% { transform: translateX(-10px); } 100% { transform: translateX(300px); } }
@keyframes runin { 0% { transform: translateX(-130px); } 100% { transform: translateX(40px); } }
@keyframes walk { from { transform: translateX(0); } to { transform: translateX(70px); } }
@keyframes sad { from { transform: rotate(0); } to { transform: rotate(-4deg) translateY(2px); } }
@keyframes dip { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(20deg); } }
@keyframes lick { from { transform: translateY(0); } to { transform: translateY(4px) rotate(5deg); } }
@keyframes rise { from { transform: translateY(18px) scale(1, .9); } to { transform: translateY(0) scale(1, 1); } }
@keyframes appear { from { opacity: 0; } to { opacity: 1; } }
@keyframes roar { 0%, 100% { transform: scale(1) rotate(0); } 30% { transform: scale(1.06) rotate(-2deg); } 60% { transform: scale(1.03) rotate(2deg); } }
@keyframes stomp { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-6px, -6px); } 50% { transform: translate(0, 0); } 75% { transform: translate(6px, -6px); } }
@keyframes shiver { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-1.6px); } 75% { transform: translateX(1.6px); } }
@keyframes dance { from { transform: rotate(-7deg) translateY(0); } to { transform: rotate(7deg) translateY(-6px); } }
@keyframes sitdown { from { transform: translateY(0) scale(1, 1); } to { transform: translateY(10px) scale(1.04, .88); } }
@keyframes leave { from { transform: translateX(0); } to { transform: translateX(170px); opacity: .2; } }
@keyframes poke { from { transform: rotate(-8deg); } to { transform: rotate(22deg); } }
@keyframes throwArm { 0% { transform: rotate(0); } 15% { transform: rotate(40deg); } 30% { transform: rotate(-120deg); } 100% { transform: rotate(-120deg); } }
@keyframes squeeze { 0%, 100% { transform: rotate(0) scale(1); } 50% { transform: rotate(-12deg) scale(.94); } }
@keyframes waveArm { from { transform: rotate(-20deg); } to { transform: rotate(-80deg); } }
@keyframes cam { from { transform: scale(1); } to { transform: scale(1.08) translate(-1.5%, -1%); } }
@keyframes sceneIn { from { transform: scale(1.08); } to { transform: scale(1); } }

/* ---------- parent gate + paywall ---------- */
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(4, 6, 20, .7); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; max-height: 92%; overflow: auto;
  background: #fbf6ee; color: #2a2440;
  border-radius: 28px 28px 0 0;
  padding-top: 22px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.sheet h3 { font-family: var(--display); font-weight: 800; font-size: 1.35rem; margin: 0; text-wrap: balance; }
.sheet p { margin: 0; line-height: 1.55; color: #5d5672; }
.answers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.answers button { height: 64px; border-radius: 16px; background: #efe6f3; font-size: 1.4rem; font-weight: 700; color: #2a2440; }
.q { font-size: 2rem; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; color: #2a2440; }
.perks { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.perks li { display: flex; gap: 10px; align-items: flex-start; line-height: 1.45; }
.perks li::before { content: ""; flex: none; width: 10px; height: 10px; margin-top: .45em; border-radius: 50%; background: #f4a9bb; }
.plans { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.plan { position: relative; text-align: left; padding: 14px; border-radius: 18px; border: 2px solid #e6dcec; background: #fff; color: #2a2440; display: flex; flex-direction: column; gap: 4px; }
.plan[aria-pressed="true"] { border-color: #c2577a; background: #fff3f6; }
.plan b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.plan small { color: #7a7290; }
.plan .save { position: absolute; top: -10px; right: 10px; background: #c2577a; color: #fff; font-size: .7rem; font-weight: 700; padding: 3px 8px; border-radius: 99px; }
.cta { height: 58px; border-radius: 18px; background: #c2577a; color: #fff; font-weight: 700; font-size: 1.05rem; }
.fine { font-size: .78rem !important; text-align: center; }
.link { color: #7a7290; font-size: .9rem; padding: 6px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #f3ecf5; }
.row span { line-height: 1.4; }
.switch { flex: none; width: 54px; height: 32px; border-radius: 99px; background: #d6cbe0; position: relative; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch[aria-checked="true"] { background: #c2577a; }
.switch[aria-checked="true"]::after { transform: translateX(22px); }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); z-index: 60; background: #2a2440; color: #fbf6ee; padding: 12px 18px; border-radius: 14px; font-size: .9rem; max-width: calc(100% - 32px); text-align: center; }

@media (prefers-reduced-motion: reduce) { .stage *, .tile * { animation: none !important; } .stage .layer { transition: none; } }
</style>

};

// ---------- home shelves ----------
function renderShelves() {
  $('shelves').innerHTML = SHELVES.map(s => `

      <div class="grid">${TALES.filter(t => t.cat === s.cat).map(t => `

        </button>`).join('')}</div>

}
renderShelves();
fetch('audio/timings.json').then(r => r.json()).then(j => { TIMINGS = j; renderShelves(); }).catch(() => {});
$('shelves').addEventListener('click', e => {
  const tile = e.target.closest('.tile'); if (!tile) return;
  const t = TALES.find(x => x.id === tile.dataset.id);
  t.free ? openPlayer(t) : gate(paywall);
});

function sceneAt(id, time) {
  const n = SCENES[id].length;
  const starts = TIMINGS[id]?.starts || Array.from({ length: n }, (_, i) => i * (audio.duration || n * 6) / n);
  let i = 0;
  while (i + 1 < n && starts[i + 1] <= time + .15) i++;
  return i;
}

// ---------- player with living pictures ----------
const audio = $('audio');

const fmt = s => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '0:00';

function showScene(i) {
  if (i === sceneIdx) return;
  sceneIdx = i;
  const back = front === 'layerA' ? 'layerB' : 'layerA';
  $(back).innerHTML = sceneSvg(current.id, i);   // fresh DOM restarts the scene's motions
  $(back).classList.remove('in'); void $(back).offsetWidth; $(back).classList.add('in');
  $(back).style.opacity = 1;
  $(front).style.opacity = 0;
  front = back;
}
function openPlayer(t) {
  current = t; sceneIdx = -1;
  $('layerA').innerHTML = $('layerB').innerHTML = '';
  showScene(0);
  $('playerTitle').textContent = t.title;
  $('hint').textContent = mode === 'night' ? 'მთვარეზე დააჭირე — ეკრანი ჩაქრება, ზღაპარი გაგრძელდება' : '';
  $('sleepBtn').hidden = mode !== 'night';
  audio.src = `audio/${t.id}.mp3`;
  audio.volume = 1;
  $('player').hidden = false;

}
function setPlayIcon() { $('playBtn').innerHTML = audio.paused ? PLAY : PAUSE; $('playBtn').setAttribute('aria-label', audio.paused ? 'დაკვრა' : 'პაუზა'); }

audio.addEventListener('play', async () => { setPlayIcon(); $('stage').classList.remove('still'); try { wake = await navigator.wakeLock?.request('screen'); } catch {} });
audio.addEventListener('pause', () => { setPlayIcon(); $('stage').classList.add('still'); try { wake?.release(); } catch {} wake = null; });
audio.addEventListener('timeupdate', () => {
  $('barFill').style.width = audio.duration ? `${audio.currentTime / audio.duration * 100}%` : '0';

  openSheet(`
    <h3>პარამეტრები</h3>
    <div class="row"><span>ზღაპრები ზედიზედ<br><small style="color:#7a7290">ერთი რომ დამთავრდება, შემდეგი დაიწყება</small></span>
      <button class="switch" id="chainSw" role="switch" aria-checked="${chain}" aria-label="ზღაპრები ზედიზედ"></button></div>
    <button class="cta" data-sub>გამოწერა — 3 დღე უფასოდ</button>
    <button class="link" data-close>დახურვა</button>`);
  $('sheet').onclick = e => {
    if (e.target.closest('[data-close]')) return closeSheet();
    if (e.target.closest('#chainSw')) { chain = !chain; store.set('chain', chain); $('chainSw').setAttribute('aria-checked', chain); }
    if (e.target.closest('[data-sub]')) paywall();
  };
});

function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 3200);
}
</script>
