<title>ქართული ზღაპრები</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700&family=Noto+Serif+Georgian:wght@600;800&display=swap">
<style>
/* Layout: phone-first storybook — mode switch, shelves of picture tiles by category, full-screen player where the living picture fills the whole screen and controls float on top */
:root {
  --page: #131938;
  --page-glow: #2d3a7a;
  --card: #1c2450;
  --ink: #f7efe0;
  --muted: #a9aed6;
  --moon: #ffd98a;
  --on-moon: #131938;
  --line: rgba(247, 239, 224, .14);
  --display: "Noto Serif Georgian", "Sylfaen", Georgia, serif;
  --body: "Noto Sans Georgian", "Sylfaen", system-ui, sans-serif;
  color-scheme: dark;
}
:root.day {
  --page: #dff1ff;
  --page-glow: #fff3d6;
  --card: #ffffff;
  --ink: #23305a;
  --muted: #5f6b94;
  --moon: #ff9f43;
  --on-moon: #ffffff;
  --line: rgba(35, 48, 90, .14);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 70% at 80% -10%, var(--page-glow) 0%, var(--page) 55%) fixed, var(--page);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--moon); outline-offset: 3px; }

.wrap {
  max-width: 560px; margin: 0 auto;
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: 1.45rem; line-height: 1.2; margin: 0; text-wrap: balance; }
.brand svg { flex: none; }
.parent-btn { flex: none; display: flex; align-items: center; gap: 7px; padding: 10px 14px; border-radius: 999px; background: var(--card); color: var(--ink); font-size: .85rem; font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.test-banner { margin: -4px 0 16px; padding: 10px 14px; border-radius: 14px; background: #e3f7e8; color: #1f6b3a; font-size: .85rem; font-weight: 600; line-height: 1.4; }

.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; border-radius: 22px; background: var(--card); margin-bottom: 22px; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
.modes button { display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: 16px; font-weight: 700; font-size: .95rem; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--moon); color: var(--on-moon); }

.shelf { margin-bottom: 26px; }
.shelf h2 { font-family: var(--display); font-weight: 800; font-size: 1.15rem; margin: 0 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.shelf h2 small { font-family: var(--body); font-weight: 400; font-size: .78rem; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.tile { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 0; text-align: left; transition: transform .15s ease; }
.tile:active { transform: scale(.96); }
.tile .art { aspect-ratio: 1 / 1; max-width: 100%; border-radius: 22px; overflow: hidden; box-shadow: 0 10px 24px rgba(0,0,0,.25); }
.tile .art svg { display: block; width: 100%; height: 100%; }
.tile .name { font-family: var(--display); font-weight: 600; font-size: 1rem; line-height: 1.3; padding-inline: 4px; }
.tile .len { padding-inline: 4px; font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile.locked .art { filter: saturate(.6) brightness(.82); }
.badge { position: absolute; top: 10px; right: 10px; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: rgba(19, 25, 56, .7); }
.badge.soon { width: auto; padding: 0 10px; border-radius: 999px; height: 28px; font-size: .72rem; font-weight: 700; color: #fff; background: rgba(19, 25, 56, .75); }
.tile .done { font-weight: 700; color: #3aa860; }
.answers#timer { grid-template-columns: repeat(4, 1fr); }
.badge.free { width: auto; padding: 0 10px; border-radius: 999px; height: 28px; font-size: .72rem; font-weight: 700; color: #131938; background: #ffd98a; }
.weekly { margin-top: 4px; padding: 14px 16px; border-radius: 18px; border: 1px dashed var(--line); color: var(--muted); font-size: .9rem; line-height: 1.5; }
.still * { animation-play-state: paused !important; }

/* ---------- full-screen player: the picture is the whole screen ---------- */
.player { position: fixed; inset: 0; z-index: 20; background: #131938; overflow: hidden; }
.stage { position: absolute; inset: 0; }
.stage .layer { position: absolute; inset: 0; transition: opacity 1s ease; }
.stage .layer.in { animation: sceneIn 1.4s ease-out both; }
.stage .layer svg { display: block; width: 100%; height: 100%; overflow: visible; }
.stage .layer svg > .cam { animation: cam 18s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 50% 50%; }
.player-top {
  position: absolute; z-index: 2; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.round { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: rgba(19, 25, 56, .45); color: #fff; backdrop-filter: blur(6px); }
.controls {
  position: absolute; z-index: 2; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding-top: 70px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, rgba(10, 12, 30, .72), rgba(10, 12, 30, 0));
  color: #fff;
}
.controls > * { width: 100%; max-width: 460px; }
.controls h2 { font-family: var(--display); font-weight: 800; font-size: 1.5rem; margin: 0; text-align: center; text-wrap: balance; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
.bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.25); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: #ffd98a; border-radius: inherit; }
.times { display: flex; justify-content: space-between; font-size: .8rem; font-variant-numeric: tabular-nums; margin-top: -8px; opacity: .85; }
.play { width: 88px !important; height: 88px; border-radius: 50%; display: grid; place-items: center; background: #ffd98a; color: #131938; box-shadow: 0 0 0 9px rgba(255, 217, 138, .22), 0 6px 30px rgba(0,0,0,.35); }
.play:active { transform: scale(.95); }
.sleep-hint { font-size: .8rem; text-align: center; opacity: .8; }

.night { position: fixed; inset: 0; z-index: 30; background: #04050d; display: grid; place-items: center; color: #3b4170; font-size: .85rem; text-align: center; padding: 24px; }
.night .z { font-family: var(--display); font-size: 2rem; opacity: .6; animation: breathe 4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .2; } }

/* ---------- living-picture motions ---------- */
.eye, .ears, .tail, .sway, .twinkle, .glow, .flap, .neck, .nod, .breathe, .sad, .idle, .arm, .flicker, .roar, .dance, .sit, .wings, .laugh, .bob, .hop { transform-box: fill-box; }
.eye { transform-origin: center; animation: blink 4.5s infinite; }
.ears { transform-origin: 50% 100%; animation: wiggle 2.6s ease-in-out infinite; }
.tail { transform-origin: 80% 100%; animation: wag 1s ease-in-out infinite alternate; }
.sway { transform-origin: 50% 100%; animation: sway 3s ease-in-out infinite alternate; }
.cloud { animation: drift 30s linear infinite; }
.spin { animation: spin 24s linear infinite; }
.twinkle { transform-origin: center; animation: twinkle 2.2s ease-in-out infinite; }
.glow { transform-origin: center; animation: glow 2.6s ease-in-out infinite alternate; }
.flap { transform-origin: 0 50%; animation: flap .7s ease-in-out infinite alternate; }
.zf { animation: zf 3s ease-out infinite; }
.neck { transform-origin: 50% 100%; }
.wind { animation: windgo 4s linear infinite; }
.flicker { transform-origin: 50% 100%; animation: flicker .45s ease-in-out infinite alternate; }
.drip { animation: drip 1.1s ease-in infinite; }
.fall { animation: fall 6s linear infinite; }
.flyaway { animation: flyaway 4.5s ease-in .8s both; }
.flutter { animation: flutter 10s ease-in-out infinite; }
.wings { transform-origin: 50% 50%; animation: wingflap .22s ease-in-out infinite alternate; }
.flyby { animation: flyby 14s linear infinite; }
.firefly { animation: firefly 7s ease-in-out infinite; }
.shoot { animation: shoot 9s ease-in infinite; }

.idle { transform-origin: 50% 100%; animation: breath 3.2s ease-in-out infinite; }
.bob { transform-origin: 50% 100%; animation: bob 1.1s ease-in-out infinite; }
.hop { transform-origin: 50% 100%; animation: hop .9s ease-in-out infinite; }
.laugh { transform-origin: 50% 100%; animation: laugh .4s ease-in-out infinite; }
.nod { transform-origin: 50% 100%; animation: nod 1.8s ease-in-out infinite; }
.breathe { transform-origin: 50% 100%; animation: breath 3.6s ease-in-out infinite; }
.run { animation: run 3.2s ease-in .4s both; }
.runin { animation: runin 6s ease-out both; }
.walk { animation: walk 14s linear both; }
.walk > * { animation: step .5s ease-in-out infinite; }
@keyframes step { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.sad { transform-origin: 50% 100%; animation: sad 2.4s ease-in-out infinite alternate; }
.sad .neck, .drink .neck { animation: dip 2.2s ease-in-out infinite; }
.lick { animation: lick .5s ease-in-out infinite alternate; }
.rise { animation: rise 2.2s ease-out both; }
.appear { animation: appear 2s ease-out both; }
.roar { transform-origin: 50% 100%; animation: roar 1.6s ease-in-out infinite; }
.stomp { animation: stomp 1.3s ease-in-out infinite; }
.shiver { animation: shiver .22s linear infinite; }
.dance { transform-origin: 50% 100%; animation: dance .7s ease-in-out infinite alternate; }
.sit { transform-origin: 50% 100%; animation: sitdown 1.6s ease-out both; }
.leave { animation: leave 14s ease-in 1s both; }
.poke .arm { transform-origin: 30% 10%; animation: poke .9s ease-in-out infinite alternate; }
.throw .arm { transform-origin: 30% 10%; animation: throwArm 4.5s ease-in-out .3s both; }
.squeeze .arm { transform-origin: 30% 10%; animation: squeeze 1.1s ease-in-out infinite; }
.wave .arm { transform-origin: 30% 10%; animation: waveArm .8s ease-in-out infinite alternate; }

@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@keyframes wiggle { 0%, 60%, 100% { transform: rotate(0); } 72% { transform: rotate(-10deg); } 86% { transform: rotate(7deg); } }
@keyframes wag { from { transform: rotate(-10deg); } to { transform: rotate(12deg); } }
@keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
@keyframes drift { from { transform: translateX(-90px); } to { transform: translateX(260px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes twinkle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .25; transform: scale(.55); } }
@keyframes glow { from { filter: drop-shadow(0 0 2px #ffd98a); } to { filter: drop-shadow(0 0 12px #ffd98a); } }
@keyframes flap { from { transform: skewY(0); } to { transform: skewY(-10deg) scaleX(.88); } }
@keyframes zf { 0% { transform: translate(0, 0); opacity: 0; } 20% { opacity: .95; } 100% { transform: translate(14px, -30px); opacity: 0; } }
@keyframes windgo { from { transform: translateX(-120px); opacity: 0; } 30% { opacity: .8; } to { transform: translateX(230px); opacity: 0; } }
@keyframes flicker { from { transform: scale(.92, .86) skewX(-3deg); } to { transform: scale(1.04, 1.1) skewX(3deg); } }
@keyframes drip { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(26px); opacity: 0; } }
@keyframes fall { 0% { transform: translate(0, -60px) rotate(0); opacity: 0; } 10% { opacity: 1; } 50% { transform: translate(18px, 60px) rotate(180deg); } 100% { transform: translate(-6px, 190px) rotate(360deg); opacity: 0; } }
@keyframes flyaway { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(110px, -190px) scale(.35); opacity: .6; } }
@keyframes flutter { 0%, 100% { transform: translate(0, 0); } 20% { transform: translate(40px, -26px); } 45% { transform: translate(90px, 4px); } 70% { transform: translate(50px, 30px); } 85% { transform: translate(10px, 12px); } }
@keyframes wingflap { from { transform: scaleX(1); } to { transform: scaleX(.25); } }
@keyframes flyby { 0% { transform: translate(-60px, 0); } 25% { transform: translate(10px, -8px); } 50% { transform: translate(80px, 4px); } 75% { transform: translate(150px, -6px); } 100% { transform: translate(260px, 2px); } }
@keyframes firefly { 0%, 100% { transform: translate(0, 0); opacity: .2; } 25% { transform: translate(14px, -10px); opacity: 1; } 50% { transform: translate(26px, 6px); opacity: .4; } 75% { transform: translate(8px, 14px); opacity: 1; } }
@keyframes shoot { 0%, 82% { transform: translate(0, 0); opacity: 0; } 85% { opacity: 1; } 100% { transform: translate(-130px, 70px); opacity: 0; } }
@keyframes bob { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-5px) scale(.98, 1.03); } }
@keyframes hop { 0%, 100% { transform: translateY(0) scale(1.04, .96); } 15% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-16px) scale(.97, 1.04); } 85% { transform: translateY(0) scale(1, 1); } }
@keyframes laugh { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-4px) rotate(3deg); } }
@keyframes nod { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(4deg); } 60% { transform: rotate(-2deg); } }
@keyframes breath { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.025, 1.05); } }
@keyframes run { 0% { transform: translateX(0); } 15% { transform: translateX(-10px); } 100% { transform: translateX(300px); } }
@keyframes runin { 0% { transform: translateX(-130px); } 100% { transform: translateX(40px); } }
@keyframes walk { from { transform: translateX(0); } to { transform: translateX(70px); } }
@keyframes sad { from { transform: rotate(0); } to { transform: rotate(-4deg) translateY(2px); } }
@keyframes dip { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(20deg); } }
@keyframes lick { from { transform: translateY(0); } to { transform: translateY(4px) rotate(5deg); } }
@keyframes rise { from { transform: translateY(18px) scale(1, .9); } to { transform: translateY(0) scale(1, 1); } }
@keyframes appear { from { opacity: 0; } to { opacity: 1; } }
@keyframes roar { 0%, 100% { transform: scale(1) rotate(0); } 30% { transform: scale(1.06) rotate(-2deg); } 60% { transform: scale(1.03) rotate(2deg); } }
@keyframes stomp { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-6px, -6px); } 50% { transform: translate(0, 0); } 75% { transform: translate(6px, -6px); } }
@keyframes shiver { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-1.6px); } 75% { transform: translateX(1.6px); } }
@keyframes dance { from { transform: rotate(-7deg) translateY(0); } to { transform: rotate(7deg) translateY(-6px); } }
@keyframes sitdown { from { transform: translateY(0) scale(1, 1); } to { transform: translateY(10px) scale(1.04, .88); } }
@keyframes leave { from { transform: translateX(0); } to { transform: translateX(170px); opacity: .2; } }
@keyframes poke { from { transform: rotate(-8deg); } to { transform: rotate(22deg); } }
@keyframes throwArm { 0% { transform: rotate(0); } 15% { transform: rotate(40deg); } 30% { transform: rotate(-120deg); } 100% { transform: rotate(-120deg); } }
@keyframes squeeze { 0%, 100% { transform: rotate(0) scale(1); } 50% { transform: rotate(-12deg) scale(.94); } }
@keyframes waveArm { from { transform: rotate(-20deg); } to { transform: rotate(-80deg); } }
@keyframes cam { from { transform: scale(1); } to { transform: scale(1.08) translate(-1.5%, -1%); } }
@keyframes sceneIn { from { transform: scale(1.08); } to { transform: scale(1); } }

/* ---------- colouring room: paint with a finger, outlines stay on top ---------- */
.paintroom { position: fixed; inset: 0; z-index: 25; background: #fffaf2; display: flex; flex-direction: column; gap: 10px; color: #2a2440;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.paint-top { display: flex; justify-content: space-between; align-items: center; }
.paint-tools { display: flex; gap: 10px; }
.round.dark { background: #efe6f3; color: #2a2440; backdrop-filter: none; }
.canvas { flex: 1; min-height: 0; display: grid; place-items: center; }
.page-stage { position: relative; background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 26px rgba(60, 40, 80, .14); }
.page-stage #pageArt, .page-stage #pageArt svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.page-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: multiply; touch-action: none; cursor: crosshair; }
.brushes { display: flex; justify-content: center; gap: 12px; }
.brushes button { width: 52px; height: 52px; border-radius: 16px; background: #efe6f3; display: grid; place-items: center; }
.brushes button i { display: block; border-radius: 50%; background: #2a2440; }
.brushes button[aria-pressed="true"] { background: #2a2440; } .brushes button[aria-pressed="true"] i { background: #fff; }
.brushes button[aria-pressed="true"] svg { stroke: #fff; }
.palette { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; max-width: 520px; width: 100%; margin: 0 auto; }
.palette button { aspect-ratio: 1; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px #d8cfe0; }
.palette button[aria-pressed="true"] { box-shadow: 0 0 0 4px #2a2440; transform: scale(1.08); }
.tile.page .art { position: relative; background: #fff; }
.tile.page .art img { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: multiply; }

/* ---------- chips, home strips ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 0 16px; padding-bottom: 4px; }
.chip { flex: none; padding: 10px 14px; border-radius: 999px; background: var(--card); color: var(--ink); font-weight: 700; font-size: .85rem; box-shadow: 0 3px 10px rgba(0,0,0,.1); }
.chip[aria-pressed="true"] { background: var(--moon); color: var(--on-moon); }
.strip { margin-bottom: 20px; }
.strip h3 { font-family: var(--display); font-size: 1rem; margin: 0 0 10px; }
.strip-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.mini { flex: none; width: 120px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.mini .art { width: 120px; height: 120px; border-radius: 18px; overflow: hidden; box-shadow: 0 6px 16px rgba(0,0,0,.2); }
.mini .art svg { width: 100%; height: 100%; display: block; }
.mini span { font-size: .8rem; font-weight: 600; line-height: 1.3; }

/* ---------- bottom tab bar ---------- */
.wrap { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 110px) !important; }
.tabs { position: fixed; z-index: 15; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--card); box-shadow: 0 -6px 24px rgba(0,0,0,.18);
  padding-top: 6px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
  padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px)); }
.tabs button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; border-radius: 14px; color: var(--muted); font-size: .62rem; font-weight: 700; line-height: 1.2; text-align: center; }
.tabs button svg { width: 26px; height: 26px; }
.tabs button[aria-pressed="true"] { color: var(--on-moon); background: var(--moon); }
.shelf-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 14px; }
.shelf-head h2 { font-family: var(--display); font-weight: 800; font-size: 1.3rem; margin: 0; text-wrap: balance; }
.shelf-head small { color: var(--muted); font-size: .8rem; flex: none; }

/* ---------- parent gate + paywall ---------- */
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(4, 6, 20, .7); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; max-height: 92%; overflow: auto;
  background: #fbf6ee; color: #2a2440;
  border-radius: 28px 28px 0 0;
  padding-top: 22px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.sheet h3 { font-family: var(--display); font-weight: 800; font-size: 1.35rem; margin: 0; text-wrap: balance; }
.sheet p { margin: 0; line-height: 1.55; color: #5d5672; }
.answers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.answers button { height: 64px; border-radius: 16px; background: #efe6f3; font-size: 1.4rem; font-weight: 700; color: #2a2440; }
.q { font-size: 2rem; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; color: #2a2440; }
.perks { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.perks li { display: flex; gap: 10px; align-items: flex-start; line-height: 1.45; }
.perks li::before { content: ""; flex: none; width: 10px; height: 10px; margin-top: .45em; border-radius: 50%; background: #f4a9bb; }
.plans { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.plan { position: relative; text-align: left; padding: 14px; border-radius: 18px; border: 2px solid #e6dcec; background: #fff; color: #2a2440; display: flex; flex-direction: column; gap: 4px; }
.plan[aria-pressed="true"] { border-color: #c2577a; background: #fff3f6; }
.plan b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.plan small { color: #7a7290; }
.plan .save { position: absolute; top: -10px; right: 10px; background: #c2577a; color: #fff; font-size: .7rem; font-weight: 700; padding: 3px 8px; border-radius: 99px; }
.cta { height: 58px; border-radius: 18px; background: #c2577a; color: #fff; font-weight: 700; font-size: 1.05rem; }
.fine { font-size: .78rem !important; text-align: center; }
.link { color: #7a7290; font-size: .9rem; padding: 6px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #f3ecf5; }
.row span { line-height: 1.4; }
.switch { flex: none; width: 54px; height: 32px; border-radius: 99px; background: #d6cbe0; position: relative; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch[aria-checked="true"] { background: #c2577a; }
.switch[aria-checked="true"]::after { transform: translateX(22px); }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); z-index: 60; background: #2a2440; color: #fbf6ee; padding: 12px 18px; border-radius: 14px; font-size: .9rem; max-width: calc(100% - 32px); text-align: center; }

@media (prefers-reduced-motion: reduce) { .stage *, .tile * { animation: none !important; } .stage .layer { transition: none; } }
</style>

<script>
// =====================================================================
// Cartoon kit: dark plum outline, flat colour + one shade + one highlight, big shiny eyes
// =====================================================================
const INK = '#3b2a4a';
const O = (w = 2.2) => `stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const eye = (x, y, closed, r = 4.4) => closed
  ? `<path d="M${x - r} ${y} q${r} ${r * .9} ${r * 2} 0" ${O(1.9)} fill="none"/><path d="M${x - r + .5} ${y + .8} l-2 1.6 M${x + r - .5} ${y + .8} l2 1.6" ${O(1.4)}/>`
  : `<g class="eye"><ellipse cx="${x}" cy="${y}" rx="${r * .86}" ry="${r}" fill="#fff" ${O(1.6)}/><circle cx="${x + .7}" cy="${y + .7}" r="${r * .58}" fill="#2a1f3a"/><circle cx="${x + 1.7}" cy="${y - .9}" r="${r * .26}" fill="#fff"/><circle cx="${x - .4}" cy="${y + 1.9}" r="${r * .12}" fill="#fff"/></g>`;
const blush = (x, y, r = 3.4) => `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * .62}" fill="#ff8fa8" opacity=".55"/>`;
const shadow = (x, y, rx) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${rx * .18}" fill="#1a1030" opacity=".18"/>`;
const SKIN = '#f2c9a0';

// things a character can hold in the raised hand (hand at local 43,59)
const HOLD = {
  stick: `<path d="M43 59 L64 76" stroke="#6a4030" stroke-width="3.4" stroke-linecap="round"/>`,
  axe: `<path d="M43 62 L46 30" stroke="#8a5a34" stroke-width="3.4" stroke-linecap="round"/><path d="M44 30 q8 -4 10 4 q-6 0 -9 4z" fill="#c9cfe0" ${O(1.4)}/>`,
  cheese: `<g transform="translate(46 56)"><path d="M-7 4 L7 -4 L9 6 L-5 9z" fill="#ffe08a" ${O(1.4)}/><circle cx="2" cy="3" r="1.3" fill="#f0c25a"/></g>`,
  stone: `<circle cx="46" cy="57" r="7" fill="#a0a4b8" ${O(1.6)}/>`,
  bird: `<g transform="translate(40 50)"><ellipse cx="6" cy="6" rx="6" ry="4.5" fill="#7ab8f0" ${O(1.2)}/><circle cx="11" cy="3" r="3.4" fill="#7ab8f0" ${O(1.2)}/><path d="M14 3 l4 1 l-4 1.4z" fill="#ffb347"/></g>`,
};

const C = {
  hare: o => shadow(34, 71, 30) + `
    <circle cx="9" cy="47" r="7" fill="#fff" ${O()}/><ellipse cx="18" cy="66" rx="9" ry="5" fill="#ece3d8" ${O()}/>
    <ellipse cx="31" cy="51" rx="23" ry="16" fill="#f5eee6" ${O()}/><path d="M14 58 q16 10 34 0" fill="none" stroke="#ddd2c6" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="45" cy="66" rx="10" ry="5" fill="#ece3d8" ${O()}/>
    <g class="ears"><path d="M44 24 C38 2 42 -8 47 -6 C53 -4 52 10 50 24z" fill="#f5eee6" ${O()}/><path d="M46 20 C43 6 45 -2 47 -1 C50 0 49 10 48.5 20z" fill="#ffb3c3"/>
      <path d="M55 24 C60 2 66 -6 70 -3 C74 1 66 14 60 25z" fill="#f5eee6" ${O()}/><path d="M57 21 C61 8 65 1 67 2 C69 5 63 14 59 22z" fill="#ffb3c3"/></g>
    <circle cx="53" cy="36" r="15" fill="#f5eee6" ${O()}/><ellipse cx="60" cy="44" rx="7" ry="5" fill="#fff"/>
    ${eye(57, 32, o.closed)}${blush(51, 42)}
    <path d="M64.5 39.5 l3 0 l-1.5 2.2z" fill="#ff7f9a" ${O(1.2)}/><path d="M66 42 q-1.5 3 -4 2 M66 42 q1.5 3 4 2" ${O(1.3)} fill="none"/>
    <path d="M70 41 l8 -1.5 M70 44 l8 1.5" stroke="${INK}" stroke-width=".9" opacity=".6"/>`,
  tortoise: o => shadow(34, 63, 30) + `
    <rect x="11" y="48" width="11" height="14" rx="5" fill="#c4dc84" ${O()}/><rect x="42" y="48" width="11" height="14" rx="5" fill="#c4dc84" ${O()}/>
    <path d="M56 46 Q62 40 63 34" stroke="${INK}" stroke-width="12.5" stroke-linecap="round"/><path d="M56 46 Q62 40 63 34" stroke="#c4dc84" stroke-width="8.5" stroke-linecap="round"/>
    <ellipse cx="32" cy="50" rx="31" ry="9" fill="#5e8a4a" ${O()}/><path d="M4 50 Q32 4 60 50z" fill="#7fb069" ${O()}/>
    <g fill="#a7cf8a" ${O(1.6)}><path d="M24 34 l8 -7 l8 7 l-3 9 h-10z"/><path d="M12 44 l6 -8 l6 2 l-1 8 h-10z"/><path d="M52 44 l-6 -8 l-6 2 l1 8 h10z"/></g>
    <path d="M14 22 q8 -6 16 -6" stroke="#fff" stroke-width="3" opacity=".5" fill="none" stroke-linecap="round"/>
    <circle cx="67" cy="30" r="11" fill="#c4dc84" ${O()}/>${eye(70, 27, o.closed, 4)}${blush(64, 35, 3)}<path d="M70 35 q3 2.6 6 0" ${O(1.4)} fill="none"/>`,
  fox: o => shadow(42, 72, 32) + `
    <g class="tail"><path d="M18 56 C-2 52 -6 28 10 16 C16 26 24 38 30 50z" fill="#f08a3c" ${O()}/><path d="M10 16 C4 22 4 30 7 34 C12 30 14 24 13 19z" fill="#fff7ee" ${O(1.6)}/></g>
    <ellipse cx="40" cy="55" rx="23" ry="15" fill="#f08a3c" ${O()}/><path d="M50 44 q8 10 4 22 q-10 2 -14 -6z" fill="#fff7ee"/>
    <rect x="26" y="60" width="9" height="12" rx="4" fill="#5a3a3a" ${O()}/><rect x="46" y="60" width="9" height="12" rx="4" fill="#5a3a3a" ${O()}/>
    <path d="M57 26 L54 6 L68 18z" fill="#f08a3c" ${O()}/><path d="M57.5 22 L56 11 L63 17z" fill="#5a3a3a"/>
    <path d="M70 18 L80 4 L82 24z" fill="#f08a3c" ${O()}/><path d="M73 18 L79 9 L80 21z" fill="#5a3a3a"/>
    <path d="M48 36 C48 20 82 16 84 34 L94 42 C90 47 84 48 78 48 C66 50 50 48 48 36z" fill="#f08a3c" ${O()}/>
    <path d="M70 40 C78 38 86 40 94 42 C90 47 84 48 78 48 C72 48 68 45 70 40z" fill="#fff7ee"/>
    <circle cx="94" cy="42" r="3.2" fill="#2a1f3a"/><circle cx="94.8" cy="41" r=".9" fill="#fff"/>${eye(69, 31, o.closed)}${blush(62, 40)}`,
  crane: o => shadow(36, 101, 26) + `
    <path d="M30 74 V100 M42 74 V100" stroke="${INK}" stroke-width="3.2"/><path d="M30 100 h-6 M42 100 h6" ${O(2.4)}/>
    <path d="M14 62 C2 60 -2 48 4 42 C14 46 22 52 26 60z" fill="#2f2a44" ${O()}/>
    <ellipse cx="37" cy="64" rx="24" ry="14" fill="#fbfbff" ${O()}/><path d="M22 68 q14 8 30 0" stroke="#dfe3f0" stroke-width="4" fill="none" stroke-linecap="round"/>
    <g class="neck"><path d="M53 60 Q63 32 48 10" stroke="${INK}" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M53 60 Q63 32 48 10" stroke="#fbfbff" stroke-width="6" fill="none" stroke-linecap="round"/>
      <circle cx="48" cy="9" r="9" fill="#fbfbff" ${O()}/><path d="M42 3 q5 -6 11 -1 q-5 2 -11 1z" fill="#e2445c" ${O(1.4)}/>
      <path d="M56 7 L86 12 L56 13z" fill="#8a8aa0" ${O(1.6)}/>${eye(50, 8, o.closed, 3.6)}${blush(46, 13, 2.4)}</g>`,
  bear: o => { const f = o.fur || '#a8743f', b = o.belly || '#e2b989'; return shadow(24, 75, 22) + `
    <ellipse cx="12" cy="72" rx="8" ry="5" fill="${f}" ${O()}/><ellipse cx="36" cy="72" rx="8" ry="5" fill="${f}" ${O()}/>
    <ellipse cx="24" cy="57" rx="19" ry="17" fill="${f}" ${O()}/><ellipse cx="24" cy="61" rx="11" ry="10" fill="${b}"/>
    <ellipse cx="7" cy="54" rx="5.5" ry="8" fill="${f}" ${O()} transform="rotate(20 7 54)"/><ellipse cx="41" cy="54" rx="5.5" ry="8" fill="${f}" ${O()} transform="rotate(-20 41 54)"/>
    <circle cx="9" cy="14" r="8" fill="${f}" ${O()}/><circle cx="39" cy="14" r="8" fill="${f}" ${O()}/><circle cx="9" cy="14" r="4" fill="${b}"/><circle cx="39" cy="14" r="4" fill="${b}"/>
    <circle cx="24" cy="30" r="18" fill="${f}" ${O()}/><path d="M12 20 q6 -6 12 -5" stroke="#fff" stroke-width="2.5" opacity=".35" fill="none" stroke-linecap="round"/>
    <ellipse cx="24" cy="38" rx="9.5" ry="7" fill="${b}" ${O(1.6)}/><ellipse cx="24" cy="34.5" rx="3.6" ry="2.6" fill="#2a1f3a"/><circle cx="25" cy="33.8" r=".9" fill="#fff"/>
    <path d="M24 37 v2.5 M24 39.5 q-3 2.5 -5 0 M24 39.5 q3 2.5 5 0" ${O(1.3)} fill="none"/>
    ${eye(16, 27, o.closed, 4)}${eye(32, 27, o.closed, 4)}${blush(12, 35, 3)}${blush(36, 35, 3)}`; },
  bird: o => `<ellipse cx="12" cy="10" rx="11" ry="8" fill="#7ab8f0" ${O(1.6)}/><path d="M6 9 q6 -4 10 2 q-6 3 -10 -2z" fill="#5a98d8"/><circle cx="21" cy="5" r="6" fill="#7ab8f0" ${O(1.6)}/><path d="M26 4 L32 6 L26 8z" fill="#ffb347" ${O(1.2)}/>${eye(22, 4, o.closed, 2.6)}`,
  fish: o => `<path d="M2 6 L-8 -1 L-6 6 L-8 13z" fill="#ff9f43" ${O(1.4)}/><ellipse cx="12" cy="6" rx="12" ry="7" fill="#ffb347" ${O(1.6)}/><path d="M8 0 v12 M13 -1 v14" stroke="#ff9f43" stroke-width="2"/>${eye(18, 4.5, o.closed, 2.4)}`,
  // a boy; Natsarkekia has patches and ash on his face, brothers wear felt hats
  boy: o => { const sh = o.shirt || '#e9784e'; return shadow(25, 80, 20) + `
    <rect x="13" y="60" width="9" height="18" rx="4" fill="#5a4a6a" ${O()}/><rect x="28" y="60" width="9" height="18" rx="4" fill="#5a4a6a" ${O()}/>
    <ellipse cx="16" cy="79" rx="7" ry="3.5" fill="#6a4030" ${O(1.6)}/><ellipse cx="34" cy="79" rx="7" ry="3.5" fill="#6a4030" ${O(1.6)}/>
    <ellipse cx="9" cy="50" rx="4.5" ry="10" fill="${sh}" ${O()} transform="rotate(10 9 50)"/><circle cx="8" cy="59" r="4" fill="${SKIN}" ${O(1.6)}/>
    <path d="M10 64 L13 38 Q25 32 37 38 L40 64z" fill="${sh}" ${O()}/><rect x="11" y="56" width="28" height="4" fill="#6a4030"/>
    ${o.patch ? `<rect x="15" y="44" width="7" height="7" rx="1.5" fill="#c9a26a" ${O(1.2)}/><rect x="29" y="49" width="6" height="6" rx="1.5" fill="#8fae5c" ${O(1.2)}/>` : `<path d="M25 38 v18" stroke="${INK}" stroke-width="1.2" opacity=".35"/>`}
    <circle cx="25" cy="22" r="16" fill="${SKIN}" ${O()}/>
    ${o.hat ? `<path d="M7 18 Q8 0 25 0 Q42 0 43 18 Q25 12 7 18z" fill="${o.hat}" ${O()}/>` : `<path d="M9 18 Q8 4 18 4 L20 -1 L24 4 L28 -1 L31 5 Q42 6 41 18 Q34 10 25 12 Q16 10 9 18z" fill="#3a2a1a" ${O()}/>`}
    ${eye(19, 23, o.closed, 3.8)}${eye(31, 23, o.closed, 3.8)}${blush(14, 29, 3)}${blush(36, 29, 3)}
    ${o.whistle ? `<circle cx="25" cy="31" r="2.6" fill="#7a3a4a" ${O(1.3)}/>` : `<path d="M20 30 q5 ${o.sad ? -2 : 4} 10 0" ${O(1.5)} fill="${o.sad ? 'none' : '#7a3a4a'}"/>`}
    ${o.ash ? '<circle cx="13" cy="17" r="1.8" fill="#8a8a96"/><circle cx="35" cy="33" r="1.5" fill="#8a8a96"/><circle cx="21" cy="10" r="1.3" fill="#8a8a96"/>' : ''}

  const parent = svgEl.parentNode, next = svgEl.nextSibling;
  measure.appendChild(svgEl);
  const bb = svgEl.querySelector('[data-who]').getBBox();
  const size = Math.max(bb.width, bb.height) * 1.1, cx = bb.x + bb.width / 2, cy = bb.y + bb.height / 2;
  svgEl.setAttribute('viewBox', `${cx - size / 2} ${cy - size / 2} ${size} ${size}`);
  if (parent) parent.insertBefore(svgEl, next); else measure.removeChild(svgEl);
}
// turn a coloured drawing into an outline page: every filled shape becomes white and tappable
function toLineArt(root) {
  root.querySelectorAll('[class]').forEach(el => el.removeAttribute('class'));
  root.querySelectorAll('[fill]').forEach(el => {
    const f = (el.getAttribute('fill') || '').toLowerCase();
    if (f === 'none' || f === INK || f === '#2a1f3a' || f === '#1a1028') return;
    const op = el.getAttribute('opacity');
    if ((op !== null && +op < 1) || f === '#1a1030') { el.remove(); return; }
    el.setAttribute('fill', '#ffffff');
    if (!el.getAttribute('stroke')) { el.setAttribute('stroke', '#cfc6dc'); el.setAttribute('stroke-width', '.8'); }
  });
  root.querySelectorAll('[stroke]').forEach(el => {
    const st = el.getAttribute('stroke').toLowerCase();
    if (st === INK) el.setAttribute('stroke-width', (+el.getAttribute('stroke-width') || 2) * 1.35);   // bolder lines for colouring
    else if (st !== '#cfc6dc' && el.getAttribute('fill') === 'none') el.setAttribute('stroke', '#cfc6dc');
  });
}
const COLORS = ['#ff5a6e', '#ff9f43', '#ffd34d', '#8fd07a', '#3aa860', '#7ab8f0', '#4a6ad0', '#a07ae0', '#ff9fd0', '#f2c9a0', '#a8743f', '#9a9aa6', '#3a3550', '#e8e2f0'];
let brush = COLORS[0], brushSize = 26, eraser = false, paintHistory = [], page = null;
const saved = store.get('paint2', {});
const cnv = $('paintCanvas'), ctx = cnv.getContext('2d');
let dpr = 1, side = 0, last = null, drawing = false;
// the page is a square that fills the space between the top bar and the tools
function fitPage() {
  const box = $('canvas'); side = Math.floor(Math.min(box.clientWidth, box.clientHeight));
  $('pageStage').style.width = $('pageStage').style.height = side + 'px';
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cnv.width = cnv.height = side * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineCap = ctx.lineJoin = 'round';
}
function restore(url) { if (!url) return; const img = new Image(); img.onload = () => { ctx.globalCompositeOperation = 'source-over'; ctx.drawImage(img, 0, 0, side, side); }; img.src = url; }
function savePage() { try { saved[page.id] = cnv.toDataURL('image/png'); store.set('paint2', saved); } catch {} }
function openPage(pg) {
  page = pg; paintHistory = [];
  $('pageArt').innerHTML = pageSvg(pg); fitArt($('pageArt').firstElementChild); toLineArt($('pageArt').firstElementChild);
  $('paint').hidden = false;
  fitPage(); restore(saved[pg.id]);
}
const at = e => { const r = cnv.getBoundingClientRect(); return [(e.clientX - r.left) * side / r.width, (e.clientY - r.top) * side / r.height]; };
function stroke(a, b) {
  ctx.globalCompositeOperation = eraser ? 'destination-out' : 'source-over';
  ctx.strokeStyle = brush; ctx.lineWidth = brushSize * side / 360;
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
}
cnv.addEventListener('pointerdown', e => {
  e.preventDefault(); cnv.setPointerCapture(e.pointerId); drawing = true;
  paintHistory.push(ctx.getImageData(0, 0, cnv.width, cnv.height)); if (paintHistory.length > 15) paintHistory.shift();
  last = at(e); stroke(last, [last[0] + .01, last[1]]);
});
cnv.addEventListener('pointermove', e => { if (!drawing) return; const p = at(e); stroke(last, p); last = p; });
const endStroke = () => { if (!drawing) return; drawing = false; savePage(); };
cnv.addEventListener('pointerup', endStroke); cnv.addEventListener('pointercancel', endStroke);
$('undoPaint').onclick = () => { const h = paintHistory.pop(); if (h) { ctx.putImageData(h, 0, 0); savePage(); } };
$('clearPaint').onclick = () => { paintHistory.push(ctx.getImageData(0, 0, cnv.width, cnv.height)); ctx.clearRect(0, 0, side, side); savePage(); };
window.addEventListener('resize', () => { if ($('paint').hidden) return; const url = cnv.toDataURL(); fitPage(); restore(url); });
$('palette').innerHTML = COLORS.map((c, i) => `<button style="background:${c}" data-c="${c}" aria-label="ფერი ${i + 1}" aria-pressed="${i === 0}"></button>`).join('');
$('palette').onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; brush = b.dataset.c; eraser = false; $('palette').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); $('brushes').querySelector('[data-eraser]').setAttribute('aria-pressed', false); };
$('brushes').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.eraser) { eraser = true; b.setAttribute('aria-pressed', true); return; }
  brushSize = +b.dataset.size; eraser = false;
  $('brushes').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
};
$('closePaint').onclick = () => { $('paint').hidden = true; renderShelves(); };
const pageThumb = pg => { const d = document.createElement('div'); d.innerHTML = pageSvg(pg); fitArt(d.firstElementChild); toLineArt(d.firstElementChild); return d.innerHTML + (saved[pg.id] ? `<img src="${saved[pg.id]}" alt="">` : ''); };

renderShelves();
fetch('audio/timings.json').then(r => r.json()).then(j => { TIMINGS = j; renderShelves(); }).catch(() => {});
fetch('tales.json').then(r => r.json()).then(list => { list.forEach(t => { TEXTS[t.id] = t.text; }); buildAutoScenes(); renderShelves(); }).catch(() => {});

function sceneAt(id, time) {
  const n = SCENES[id].length;
  const starts = TIMINGS[id]?.starts || Array.from({ length: n }, (_, i) => i * (audio.duration || n * 6) / n);
  let i = 0;
  while (i + 1 < n && starts[i + 1] <= time + .15) i++;
  return i;
}

// ---------- player with living pictures ----------
const audio = $('audio');
let current = null, sceneIdx = -1, front = 'layerA', wake = null;
const fmt = s => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '0:00';

function showScene(i) {
  if (i === sceneIdx) return;
  sceneIdx = i;
  const back = front === 'layerA' ? 'layerB' : 'layerA';
  $(back).innerHTML = sceneSvg(current.id, i);   // fresh DOM restarts the scene's motions
  $(back).classList.remove('in'); void $(back).offsetWidth; $(back).classList.add('in');
  $(back).style.opacity = 1;
  $(front).style.opacity = 0;
  front = back;
}
function openPlayer(t) {
  current = t; sceneIdx = -1;
  $('layerA').innerHTML = $('layerB').innerHTML = '';
  showScene(0);
  $('playerTitle').textContent = t.title;
  paintFav();
  $('hint').textContent = mode === 'night' ? 'მთვარეზე დააჭირე — ეკრანი ჩაქრება, ზღაპარი გაგრძელდება' : '';
  $('sleepBtn').hidden = mode !== 'night';
  audio.src = `audio/${t.id}.mp3`;
  audio.volume = 1;
  // continue where the child stopped last time
  const at = positions[t.id] || 0;
  audio.addEventListener('loadedmetadata', () => { if (at > 8 && at < audio.duration - 8) audio.currentTime = at; }, { once: true });
  $('player').hidden = false;
  audio.play().catch(() => {});
}
const HEART = on => `<svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="${on ? '#ff7f9a' : 'none'}" stroke="${on ? '#ff7f9a' : '#fff'}" stroke-width="2.2" stroke-linejoin="round"/></svg>`;
function paintFav() { $('favBtn').innerHTML = HEART(!!favs[current.id]); }
$('favBtn').onclick = () => { if (favs[current.id]) delete favs[current.id]; else favs[current.id] = 1; store.set('favs', favs); paintFav(); };
function setPlayIcon() { $('playBtn').innerHTML = audio.paused ? PLAY : PAUSE; $('playBtn').setAttribute('aria-label', audio.paused ? 'დაკვრა' : 'პაუზა'); }
$('playBtn').onclick = () => audio.paused ? audio.play() : audio.pause();
$('closePlayer').onclick = () => { audio.pause(); $('player').hidden = true; $('layerA').innerHTML = $('layerB').innerHTML = ''; renderShelves(); };
audio.addEventListener('play', async () => { setPlayIcon(); $('stage').classList.remove('still'); try { wake = await navigator.wakeLock?.request('screen'); } catch {} });
audio.addEventListener('pause', () => { setPlayIcon(); $('stage').classList.add('still'); try { wake?.release(); } catch {} wake = null; });
audio.addEventListener('timeupdate', () => {
  $('barFill').style.width = audio.duration ? `${audio.currentTime / audio.duration * 100}%` : '0';
  $('tCur').textContent = fmt(audio.currentTime);
  $('tDur').textContent = fmt(audio.duration);
  if (current) showScene(sceneAt(current.id, audio.currentTime));
  if (current && Math.floor(audio.currentTime) % 5 === 0) { positions[current.id] = audio.currentTime; store.set('pos', positions); }
  // sleep timer: fade out over the last 20 seconds, then stop
  if (sleepAt) {
    const left = (sleepAt - Date.now()) / 1000;
    if (left <= 0) { audio.pause(); audio.volume = 1; sleepAt = 0; }
    else if (left < 20) audio.volume = Math.max(0, left / 20);
  }
});
audio.addEventListener('ended', () => {
  listened[current.id] = 1; store.set('listened', listened);
  delete positions[current.id]; store.set('pos', positions);
  // next open tale on the same shelf; bedtime stories run on into each other
  const shelf = TALES.filter(t => t.cat === current.cat && open_(t));
  const next = shelf[shelf.indexOf(current) + 1] || (current.cat === 'sleep' ? shelf[0] : null);
  if (chain && next && next !== current) openPlayer(next); else setPlayIcon();
});
setPlayIcon();

// bedtime: screen goes dark, story keeps playing
$('sleepBtn').onclick = () => { $('night').hidden = false; if (audio.paused) audio.play().catch(() => {}); };
audio.addEventListener('play', () => { if (sleepMin && !sleepAt) sleepAt = Date.now() + sleepMin * 60000; });
$('night').onclick = () => { $('night').hidden = true; };

// ---------- parent gate ----------
function openSheet(html) { $('sheet').innerHTML = html; $('sheetBg').hidden = false; }
function closeSheet() { $('sheetBg').hidden = true; }
$('sheetBg').addEventListener('click', e => { if (e.target === $('sheetBg')) closeSheet(); });

function gate(onPass) {
  const a = 4 + Math.floor(Math.random() * 5), b = 3 + Math.floor(Math.random() * 6), sum = a + b;
  const opts = [sum, sum + 2, sum - 3].sort(() => Math.random() - .5);
  openSheet(`
    <h3>მშობლებისთვის</h3>
    <p>გთხოვთ, ამოხსენით მაგალითი, რომ გაგრძელდეს.</p>
    <div class="q">${a} + ${b} = ?</div>
    <div class="answers">${opts.map(o => `<button data-v="${o}">${o}</button>`).join('')}</div>
    <button class="link" data-close>დახურვა</button>`);
  $('sheet').onclick = e => {
    if (e.target.closest('[data-close]')) return closeSheet();
    const btn = e.target.closest('[data-v]'); if (!btn) return;
    Number(btn.dataset.v) === sum ? onPass() : closeSheet();
  };
}

// ---------- parent settings ----------
$('parentBtn').onclick = () => gate(() => {
  openSheet(`
    <h3>პარამეტრები</h3>
    <div class="row"><span>ზღაპრები ზედიზედ<br><small style="color:#7a7290">ერთი რომ დამთავრდება, შემდეგი დაიწყება</small></span>
      <button class="switch" id="chainSw" role="switch" aria-checked="${chain}" aria-label="ზღაპრები ზედიზედ"></button></div>
    <div class="row"><span>ძილის ტაიმერი<br><small style="color:#7a7290">ხმა ნელა ჩაქრება და ზღაპარი გაჩერდება</small></span></div>
    <div class="answers" id="timer">${[0, 15, 30, 45].map(m => `<button data-min="${m}" style="font-size:1rem;height:52px;${m === sleepMin ? 'background:#c2577a;color:#fff' : ''}">${m ? m + ' წთ' : 'გამორთ.'}</button>`).join('')}</div>
    <div class="row"><span>სატესტო რეჟიმი<br><small style="color:#7a7290">ყველა ზღაპარი ღიაა გადახდის გარეშე</small></span>
      <button class="switch" id="testSw" role="switch" aria-checked="${testMode}" aria-label="სატესტო რეჟიმი"></button></div>
    <button class="cta" data-sub>გამოწერა — 3 დღე უფასოდ</button>
    <button class="link" data-close>დახურვა</button>`);
  $('sheet').onclick = e => {
    if (e.target.closest('[data-close]')) return closeSheet();
    if (e.target.closest('#chainSw')) { chain = !chain; store.set('chain', chain); $('chainSw').setAttribute('aria-checked', chain); }
    if (e.target.closest('#testSw')) { testMode = !testMode; store.set('test', testMode); $('testSw').setAttribute('aria-checked', testMode); renderShelves(); }
    const m = e.target.closest('[data-min]');
    if (m) { sleepMin = +m.dataset.min; store.set('sleepMin', sleepMin); sleepAt = 0; $('timer').querySelectorAll('button').forEach(b => { const on = +b.dataset.min === sleepMin; b.style.background = on ? '#c2577a' : ''; b.style.color = on ? '#fff' : ''; }); }
    if (e.target.closest('[data-sub]')) paywall();

function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 3200);
}
</script>
