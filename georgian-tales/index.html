<title>ქართული ზღაპრები</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700&family=Noto+Serif+Georgian:wght@600;800&display=swap">
<style>
/* Layout: phone-first storybook — mode switch (cartoon by day / bedtime at night), big picture tiles 2 per row, full-screen player with "living pictures" synced to the narration */
:root {
  /* bedtime (night) palette — default tokens */
  --page: #131938;
  --page-glow: #2d3a7a;
  --card: #1c2450;
  --ink: #f7efe0;
  --muted: #a9aed6;
  --moon: #ffd98a;
  --on-moon: #131938;
  --line: rgba(247, 239, 224, .14);
  --display: "Noto Serif Georgian", "Sylfaen", Georgia, serif;
  --body: "Noto Sans Georgian", "Sylfaen", system-ui, sans-serif;
  color-scheme: dark;
}
/* cartoon (day) palette — the app's own mode, chosen by the parent or by the clock */
:root.day {
  --page: #dff1ff;
  --page-glow: #fff3d6;
  --card: #ffffff;
  --ink: #23305a;
  --muted: #5f6b94;
  --moon: #ff9f43;
  --on-moon: #ffffff;
  --line: rgba(35, 48, 90, .14);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 70% at 80% -10%, var(--page-glow) 0%, var(--page) 55%) fixed, var(--page);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .4s;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--moon); outline-offset: 3px; }

.wrap {
  max-width: 560px; margin: 0 auto;
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: 1.45rem; line-height: 1.2; margin: 0; text-wrap: balance; }
.brand svg { flex: none; }
.parent-btn {
  flex: none; display: flex; align-items: center; gap: 6px;
  padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line);
  color: var(--muted); font-size: .8rem;
}

/* mode switch: big, two halves, readable by pictures alone */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; border-radius: 22px; background: var(--card); margin-bottom: 18px; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
.modes button { display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: 16px; font-weight: 700; font-size: .95rem; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--moon); color: var(--on-moon); }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.tile { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 0; text-align: left; transition: transform .15s ease; }
.tile:active { transform: scale(.96); }
.tile .art { aspect-ratio: 1 / 1; max-width: 100%; border-radius: 22px; overflow: hidden; box-shadow: 0 10px 24px rgba(0,0,0,.25); }
.tile .art svg { display: block; width: 100%; height: 100%; }
.tile .name { font-family: var(--display); font-weight: 600; font-size: 1rem; line-height: 1.3; padding-inline: 4px; }
.tile.locked .art { filter: saturate(.55) brightness(.8); }
.badge { position: absolute; top: 10px; right: 10px; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: rgba(19, 25, 56, .7); }
.badge.free { width: auto; padding: 0 10px; border-radius: 999px; height: 28px; font-size: .72rem; font-weight: 700; color: #131938; background: #ffd98a; }
.weekly { margin-top: 22px; padding: 14px 16px; border-radius: 18px; border: 1px dashed var(--line); color: var(--muted); font-size: .9rem; line-height: 1.5; }
.still * { animation: none !important; }

/* ---------- player ---------- */
.player {
  position: fixed; inset: 0; z-index: 20;
  display: flex; flex-direction: column; align-items: center;
  background: var(--page);
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.player-top { width: 100%; max-width: 560px; display: flex; justify-content: space-between; align-items: center; }
.round { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--card); color: var(--ink); }
.player-body { flex: 1; width: 100%; max-width: 460px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; min-height: 0; }
.stage { position: relative; width: min(100%, 54vh); aspect-ratio: 1 / 1; max-width: 100%; border-radius: 30px; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,.35); background: #131938; }
.stage .layer { position: absolute; inset: 0; transition: opacity .9s ease; }
.stage .layer svg { display: block; width: 100%; height: 100%; }
.stage .layer.cam svg { animation: cam 16s ease-in-out infinite alternate; }
.player h2 { font-family: var(--display); font-weight: 800; font-size: 1.6rem; margin: 0; text-align: center; text-wrap: balance; }
.bar { width: 100%; height: 8px; border-radius: 99px; background: var(--card); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--moon); border-radius: inherit; }
.times { width: 100%; display: flex; justify-content: space-between; color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; margin-top: -12px; }
.play { width: 108px; height: 108px; border-radius: 50%; display: grid; place-items: center; background: var(--moon); color: var(--on-moon); box-shadow: 0 0 0 10px color-mix(in srgb, var(--moon) 18%, transparent), 0 0 50px color-mix(in srgb, var(--moon) 40%, transparent); }
.play:active { transform: scale(.95); }
.sleep-hint { color: var(--muted); font-size: .8rem; text-align: center; }

.night { position: fixed; inset: 0; z-index: 30; background: #04050d; display: grid; place-items: center; color: #3b4170; font-size: .85rem; text-align: center; padding: 24px; }
.night .z { font-family: var(--display); font-size: 2rem; opacity: .6; animation: breathe 4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .2; } }

/* ---------- living-picture motions (SVG parts) ---------- */
.eye, .ears, .tail, .sway, .spin, .twinkle, .glow, .flap, .neck, .nod, .breathe, .sad { transform-box: fill-box; }
.eye { transform-origin: center; animation: blink 4.5s infinite; }
.ears { transform-origin: 50% 100%; animation: wiggle 2.6s ease-in-out infinite; }
.tail { transform-origin: 80% 100%; animation: wag 1.4s ease-in-out infinite alternate; }
.sway { transform-origin: 50% 100%; animation: sway 4s ease-in-out infinite alternate; }
.cloud { animation: drift 46s linear infinite; }
.spin { transform-origin: center; animation: spin 30s linear infinite; }
.twinkle { transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
.glow { transform-origin: center; animation: glow 3s ease-in-out infinite alternate; }
.flap { transform-origin: 0 50%; animation: flap 1s ease-in-out infinite alternate; }
.zf { animation: zf 3s ease-out infinite; }
.neck { transform-origin: 50% 100%; }
.wind { animation: windgo 5s linear infinite; }

.bob { animation: bob 1.4s ease-in-out infinite; }
.laugh { animation: bob .35s ease-in-out infinite; }
.nod { transform-origin: 50% 100%; animation: nod 2.2s ease-in-out infinite; }
.breathe { transform-origin: 50% 100%; animation: breath 3.6s ease-in-out infinite; }
.run { animation: run 3.2s ease-in .4s both; }
.runin { animation: runin 6s ease-out both; }
.walk { animation: walk 14s linear both, bob 1.6s ease-in-out infinite; }
.sad { transform-origin: 50% 100%; animation: sad 3s ease-in-out infinite alternate; }
.sad .neck, .drink .neck { animation: dip 2.4s ease-in-out infinite; }
.lick { animation: lick .6s ease-in-out infinite alternate; }
.rise { animation: rise 8s ease-out both; }
.appear { animation: appear 2s ease-out both; }

@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@keyframes wiggle { 0%, 70%, 100% { transform: rotate(0); } 80% { transform: rotate(-8deg); } 90% { transform: rotate(5deg); } }
@keyframes wag { from { transform: rotate(-8deg); } to { transform: rotate(10deg); } }
@keyframes sway { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
@keyframes drift { from { transform: translateX(-80px); } to { transform: translateX(260px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes twinkle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .25; transform: scale(.6); } }
@keyframes glow { from { filter: drop-shadow(0 0 2px #ffd98a); } to { filter: drop-shadow(0 0 10px #ffd98a); } }
@keyframes flap { from { transform: skewY(0); } to { transform: skewY(-8deg) scaleX(.9); } }
@keyframes zf { 0% { transform: translate(0, 0); opacity: 0; } 20% { opacity: .9; } 100% { transform: translate(12px, -26px); opacity: 0; } }
@keyframes windgo { from { transform: translateX(-120px); opacity: 0; } 30% { opacity: .7; } to { transform: translateX(220px); opacity: 0; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes nod { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(3deg); } }
@keyframes breath { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.02, 1.05); } }
@keyframes run { 0% { transform: translateX(0); } 15% { transform: translateX(-8px); } 100% { transform: translateX(300px); } }
@keyframes runin { 0% { transform: translateX(-120px); } 100% { transform: translateX(40px); } }
@keyframes walk { from { transform: translateX(0); } to { transform: translateX(60px); } }
@keyframes sad { from { transform: rotate(0); } to { transform: rotate(-3deg) translateY(2px); } }
@keyframes dip { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(18deg); } }
@keyframes lick { from { transform: translateY(0); } to { transform: translateY(3px) rotate(4deg); } }
@keyframes rise { from { transform: translateY(26px); opacity: .4; } to { transform: translateY(0); opacity: 1; } }
@keyframes appear { from { opacity: 0; } to { opacity: 1; } }
@keyframes cam { from { transform: scale(1); } to { transform: scale(1.07) translate(-1.5%, -1%); } }

/* ---------- parent gate + paywall ---------- */
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(4, 6, 20, .7); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; max-height: 92%; overflow: auto;
  background: #fbf6ee; color: #2a2440;
  border-radius: 28px 28px 0 0;
  padding-top: 22px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.sheet h3 { font-family: var(--display); font-weight: 800; font-size: 1.35rem; margin: 0; text-wrap: balance; }
.sheet p { margin: 0; line-height: 1.55; color: #5d5672; }
.answers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.answers button { height: 64px; border-radius: 16px; background: #efe6f3; font-size: 1.4rem; font-weight: 700; color: #2a2440; }
.q { font-size: 2rem; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; color: #2a2440; }
.perks { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.perks li { display: flex; gap: 10px; align-items: flex-start; line-height: 1.45; }
.perks li::before { content: ""; flex: none; width: 10px; height: 10px; margin-top: .45em; border-radius: 50%; background: #f4a9bb; }
.plans { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.plan { position: relative; text-align: left; padding: 14px; border-radius: 18px; border: 2px solid #e6dcec; background: #fff; color: #2a2440; display: flex; flex-direction: column; gap: 4px; }
.plan[aria-pressed="true"] { border-color: #c2577a; background: #fff3f6; }
.plan b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.plan small { color: #7a7290; }
.plan .save { position: absolute; top: -10px; right: 10px; background: #c2577a; color: #fff; font-size: .7rem; font-weight: 700; padding: 3px 8px; border-radius: 99px; }
.cta { height: 58px; border-radius: 18px; background: #c2577a; color: #fff; font-weight: 700; font-size: 1.05rem; }
.fine { font-size: .78rem !important; text-align: center; }
.link { color: #7a7290; font-size: .9rem; padding: 6px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #f3ecf5; }
.row span { line-height: 1.4; }
.switch { flex: none; width: 54px; height: 32px; border-radius: 99px; background: #d6cbe0; position: relative; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch[aria-checked="true"] { background: #c2577a; }
.switch[aria-checked="true"]::after { transform: translateX(22px); }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); z-index: 60; background: #2a2440; color: #fbf6ee; padding: 12px 18px; border-radius: 14px; font-size: .9rem; max-width: calc(100% - 32px); text-align: center; }

@media (prefers-reduced-motion: reduce) { .stage *, .tile * { animation: none !important; } .stage .layer { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><path d="M27 6a15 15 0 1 0 8 25A13 13 0 0 1 27 6z" fill="#ffd98a"/><circle cx="31" cy="9" r="1.6" fill="#f4a9bb"/><circle cx="36" cy="17" r="1" fill="#f4a9bb"/></svg>
      <h1>ქართული ზღაპრები</h1>
    </div>
    <button class="parent-btn" id="parentBtn" aria-label="მშობლებისთვის">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      მშობლებს
    </button>
  </header>

  <div class="modes" role="group" aria-label="რეჟიმი">
    <button id="modeDay" aria-pressed="false">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></g></svg>
      მულტფილმი
    </button>
    <button id="modeNight" aria-pressed="false">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3a9 9 0 1 0 6 14A8 8 0 0 1 15 3z" fill="currentColor"/></svg>
      ძილის წინ
    </button>
  </div>

  <div class="grid" id="grid"></div>
  <p class="weekly">ყოველ კვირას — ორი ახალი ზღაპარი. შემდეგი: <b>ხუთკუნჭულა</b> და <b>კონკია</b></p>
</div>

<div class="player" id="player" hidden>
  <div class="player-top">
    <button class="round" id="closePlayer" aria-label="უკან">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="round" id="sleepBtn" aria-label="ეკრანის ჩაქრობა">
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M15 3a9 9 0 1 0 6 14A8 8 0 0 1 15 3z" fill="#ffd98a"/></svg>
    </button>
  </div>
  <div class="player-body">
    <div class="stage" id="stage"><div class="layer cam" id="layerA"></div><div class="layer cam" id="layerB" style="opacity:0"></div></div>
    <h2 id="playerTitle"></h2>
    <div class="bar"><i id="barFill"></i></div>
    <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    <button class="play" id="playBtn" aria-label="დაკვრა"></button>
    <span class="sleep-hint" id="hint"></span>
  </div>
</div>

<div class="night" id="night" hidden>
  <div><div class="z">z z z</div><p>შეეხე ეკრანს, რომ გაიღვიძო</p></div>
</div>

<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<audio id="audio" preload="none"></audio>

<script>
// =====================================================================
// Characters — drawn facing right, feet on y≈70 (crane ≈100, bear ≈74)
// =====================================================================
const eye = (x, y, closed) => closed
  ? `<path d="M${x - 2.6} ${y} q2.6 2.2 5.2 0" stroke="#2a2440" stroke-width="1.7" fill="none" stroke-linecap="round"/>`
  : `<circle class="eye" cx="${x}" cy="${y}" r="2.3" fill="#2a2440"/>`;

const C = {
  hare: o => `<circle cx="8" cy="48" r="5.5" fill="#fff"/><ellipse cx="30" cy="52" rx="22" ry="15" fill="#e9e1d6"/><ellipse cx="44" cy="65" rx="10" ry="4.5" fill="#d8cfc2"/><ellipse cx="18" cy="66" rx="8" ry="4" fill="#d8cfc2"/>
    <g class="ears"><ellipse cx="47" cy="16" rx="4.6" ry="14" fill="#e9e1d6" transform="rotate(-12 47 16)"/><ellipse cx="57" cy="17" rx="4.6" ry="14" fill="#e9e1d6" transform="rotate(14 57 17)"/><ellipse cx="47.5" cy="17" rx="2.1" ry="9.5" fill="#f4a9bb" transform="rotate(-12 47.5 17)"/></g>
    <circle cx="52" cy="37" r="12.5" fill="#e9e1d6"/>${eye(57, 34, o.closed)}<circle cx="64" cy="39" r="1.8" fill="#f4a9bb"/><circle cx="55" cy="41" r="2.4" fill="#f4a9bb" opacity=".45"/>`,
  tortoise: o => `<rect x="12" y="50" width="9" height="12" rx="4" fill="#8fae5c"/><rect x="42" y="50" width="9" height="12" rx="4" fill="#8fae5c"/><ellipse cx="32" cy="50" rx="30" ry="12" fill="#8a6a3b"/><path d="M6 50 Q32 10 58 50z" fill="#b58b4c"/><path d="M20 38 L32 26 L44 38 M32 26 V48 M14 46 L22 38 M50 46 L42 38" stroke="#8a6a3b" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M56 46 Q62 40 64 36" stroke="#9fb86a" stroke-width="8" stroke-linecap="round"/><circle cx="66" cy="34" r="8.5" fill="#9fb86a"/>${eye(69, 32, o.closed)}<path d="M68 38 q3 2 5 0" stroke="#5a7a3a" stroke-width="1.4" fill="none" stroke-linecap="round"/>`,
  fox: o => `<path class="tail" d="M16 54 Q-6 34 16 20" stroke="#e07a3a" stroke-width="13" fill="none" stroke-linecap="round"/><circle cx="16" cy="19" r="5.5" fill="#fff"/><ellipse cx="38" cy="54" rx="22" ry="14" fill="#e07a3a"/><rect x="26" y="60" width="7" height="11" rx="3" fill="#c0602a"/><rect x="45" y="60" width="7" height="11" rx="3" fill="#c0602a"/>
    <path d="M48 40 L63 18 L78 41 Z" fill="#e88a4a"/><path d="M56 28 L58 10 L65 24 Z M67 24 L75 10 L76 30 Z" fill="#c8602a"/><path d="M63 34 L84 43 L65 46 Z" fill="#fff"/><circle cx="83.5" cy="42.5" r="2.2" fill="#2a2440"/>${eye(66, 31, o.closed)}`,
  crane: o => `<path d="M30 72 V100 M42 72 V100" stroke="#3a3550" stroke-width="2.6"/><ellipse cx="36" cy="64" rx="23" ry="13" fill="#eef0f6"/><path d="M15 62 Q2 58 5 47 Q20 53 24 60" fill="#3a3550"/>
    <g class="neck"><path d="M52 60 Q62 32 47 9" stroke="#eef0f6" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="47" cy="8" r="7.5" fill="#eef0f6"/><circle cx="45" cy="2.5" r="3.2" fill="#d9475a"/><path d="M53 7 L82 13 L53 11 Z" fill="#3a3550"/>${eye(49, 7, o.closed)}</g>`,
  bear: o => `<ellipse cx="24" cy="58" rx="19" ry="16" fill="${o.fur || '#9a6a42'}"/><ellipse cx="24" cy="62" rx="10" ry="9" fill="${o.belly || '#c99a6e'}"/><ellipse cx="13" cy="72" rx="7" ry="4" fill="${o.fur || '#9a6a42'}"/><ellipse cx="35" cy="72" rx="7" ry="4" fill="${o.fur || '#9a6a42'}"/>
    <circle cx="9" cy="16" r="7.5" fill="${o.fur || '#9a6a42'}"/><circle cx="39" cy="16" r="7.5" fill="${o.fur || '#9a6a42'}"/><circle cx="9" cy="16" r="3.6" fill="${o.belly || '#c99a6e'}"/><circle cx="39" cy="16" r="3.6" fill="${o.belly || '#c99a6e'}"/>

// ---------- mode: cartoon by day, bedtime at night ----------
const hour = new Date().getHours();

  mode = m; store.set('mode', m);

// ---------- timings: when each paragraph (scene) starts ----------
let TIMINGS = {};
fetch('audio/timings.json').then(r => r.json()).then(j => { TIMINGS = j; }).catch(() => {});
function sceneAt(id, time) {
  const n = SCENES[id].length;
  const starts = TIMINGS[id] || Array.from({ length: n }, (_, i) => i * (audio.duration || n * 6) / n);
  let i = 0;
  while (i + 1 < n && starts[i + 1] <= time + .15) i++;
  return i;
}

const audio = $('audio');
let current = null, sceneIdx = -1, front = 'layerA', wake = null;
const fmt = s => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '0:00';

function showScene(i) {
  if (i === sceneIdx) return;
  sceneIdx = i;
  const back = front === 'layerA' ? 'layerB' : 'layerA';
  $(back).innerHTML = sceneSvg(current.id, i);   // fresh DOM restarts the scene's motions
  $(back).style.opacity = 1;
  $(front).style.opacity = 0;
  front = back;
}
function openPlayer(t) {
  current = t; sceneIdx = -1;
  $('layerA').innerHTML = $('layerB').innerHTML = '';
  showScene(0);
  $('playerTitle').textContent = t.title;
  $('hint').textContent = mode === 'night' ? 'მთვარეზე დააჭირე — ეკრანი ჩაქრება, ზღაპარი გაგრძელდება' : 'უყურე და მოუსმინე';
  $('sleepBtn').hidden = mode !== 'night';
  audio.src = `audio/${t.id}.mp3`;
  audio.volume = 1;
  $('player').hidden = false;
  audio.play().catch(() => {});
}
function setPlayIcon() { $('playBtn').innerHTML = audio.paused ? PLAY : PAUSE; $('playBtn').setAttribute('aria-label', audio.paused ? 'დაკვრა' : 'პაუზა'); }
$('playBtn').onclick = () => audio.paused ? audio.play() : audio.pause();
$('closePlayer').onclick = () => { audio.pause(); $('player').hidden = true; $('layerA').innerHTML = $('layerB').innerHTML = ''; };
audio.addEventListener('play', async () => { setPlayIcon(); $('stage').classList.remove('still'); try { wake = await navigator.wakeLock?.request('screen'); } catch {} });
audio.addEventListener('pause', () => { setPlayIcon(); $('stage').classList.add('still'); try { wake?.release(); } catch {} wake = null; });
audio.addEventListener('timeupdate', () => {
  $('barFill').style.width = audio.duration ? `${audio.currentTime / audio.duration * 100}%` : '0';
  $('tCur').textContent = fmt(audio.currentTime);
  $('tDur').textContent = fmt(audio.duration);
  if (current) showScene(sceneAt(current.id, audio.currentTime));
});
audio.addEventListener('ended', () => {
  const free = TALES.filter(t => t.free);
  const next = free[free.indexOf(current) + 1];
  if (chain && next) openPlayer(next); else setPlayIcon();
});
setPlayIcon();

// bedtime: screen goes dark, story keeps playing
$('sleepBtn').onclick = () => { $('night').hidden = false; if (audio.paused) audio.play().catch(() => {}); };
$('night').onclick = () => { $('night').hidden = true; };

// ---------- parent gate ----------
function openSheet(html) { $('sheet').innerHTML = html; $('sheetBg').hidden = false; }
function closeSheet() { $('sheetBg').hidden = true; }
$('sheetBg').addEventListener('click', e => { if (e.target === $('sheetBg')) closeSheet(); });

function gate(onPass) {
  const a = 4 + Math.floor(Math.random() * 5), b = 3 + Math.floor(Math.random() * 6), sum = a + b;
  const opts = [sum, sum + 2, sum - 3].sort(() => Math.random() - .5);
  openSheet(`
    <h3>მშობლებისთვის</h3>
    <p>გთხოვთ, ამოხსენით მაგალითი, რომ გაგრძელდეს.</p>
    <div class="q">${a} + ${b} = ?</div>
    <div class="answers">${opts.map(o => `<button data-v="${o}">${o}</button>`).join('')}</div>
    <button class="link" data-close>დახურვა</button>`);
  $('sheet').onclick = e => {
    if (e.target.closest('[data-close]')) return closeSheet();
    const btn = e.target.closest('[data-v]'); if (!btn) return;
    Number(btn.dataset.v) === sum ? onPass() : closeSheet();
  };
}

// ---------- paywall ----------
function paywall() {
  let plan = 'year';
  openSheet(`
    <h3>ყველა ზღაპარი თქვენი პატარასთვის</h3>
    <ul class="perks">
      <li>ქართული და მსოფლიოს საუკეთესო ზღაპრები, ნაზი ხმით</li>
      <li>ცოცხალი სურათები — პატარა მულტფილმი ყველა ზღაპარში</li>
      <li>ყოველ კვირას — ორი ახალი ზღაპარი</li>
      <li>ძილის წინ: ეკრანი ქრება, ზღაპარი გრძელდება</li>
      <li>რეკლამის გარეშე</li>
    </ul>
    <div class="plans">
      <button class="plan" data-plan="month" aria-pressed="false"><small>თვე</small><b>4.99 ₾</b><small>ყოველთვიურად</small></button>
      <button class="plan" data-plan="year" aria-pressed="true"><span class="save">−50%</span><small>წელი</small><b>29.99 ₾</b><small>2.50 ₾ თვეში</small></button>
    </div>
    <button class="cta" data-buy>3 დღე უფასოდ</button>
    <p class="fine" id="fine"></p>
    <button class="link" data-close>მოგვიანებით</button>`);
  const fine = () => { $('fine').textContent = `3 დღის შემდეგ — ${plan === 'year' ? '29.99 ₾ წელიწადში' : '4.99 ₾ თვეში'}. გაუქმება ნებისმიერ დროს Google Play-ში.`; };
  fine();
  $('sheet').onclick = e => {
    if (e.target.closest('[data-close]')) return closeSheet();
    const p = e.target.closest('[data-plan]');
    if (p) { plan = p.dataset.plan; $('sheet').querySelectorAll('.plan').forEach(b => b.setAttribute('aria-pressed', b === p)); fine(); }
    if (e.target.closest('[data-buy]')) { closeSheet(); toast('პროტოტიპი: აქ გაიხსნება Google Play-ის გადახდა'); }
  };
}

// ---------- parent settings ----------
$('parentBtn').onclick = () => gate(() => {
  openSheet(`
    <h3>პარამეტრები</h3>
    <div class="row"><span>ზღაპრები ზედიზედ<br><small style="color:#7a7290">ერთი რომ დამთავრდება, შემდეგი დაიწყება</small></span>
      <button class="switch" id="chainSw" role="switch" aria-checked="${chain}" aria-label="ზღაპრები ზედიზედ"></button></div>
    <button class="cta" data-sub>გამოწერა — 3 დღე უფასოდ</button>
    <button class="link" data-close>დახურვა</button>`);
  $('sheet').onclick = e => {
    if (e.target.closest('[data-close]')) return closeSheet();
    if (e.target.closest('#chainSw')) { chain = !chain; store.set('chain', chain); $('chainSw').setAttribute('aria-checked', chain); }
    if (e.target.closest('[data-sub]')) paywall();
  };
});

function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 3200);
}
</script>
