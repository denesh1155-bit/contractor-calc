<title>ქართული ზღაპრები</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700&family=Noto+Serif+Georgian:wght@600;800&display=swap">
<style>
/* Layout: phone-first storybook — mode switch, shelves of picture tiles by category, full-screen player where the living picture fills the whole screen and controls float on top */
:root {
  --page: #131938;
  --page-glow: #2d3a7a;
  --card: #1c2450;
  --ink: #f7efe0;
  --muted: #a9aed6;
  --moon: #ffd98a;
  --on-moon: #131938;
  --line: rgba(247, 239, 224, .14);
  --display: "Noto Serif Georgian", "Sylfaen", Georgia, serif;
  --body: "Noto Sans Georgian", "Sylfaen", system-ui, sans-serif;
  color-scheme: dark;
}
:root.day {
  --page: #dff1ff;
  --page-glow: #fff3d6;
  --card: #ffffff;
  --ink: #23305a;
  --muted: #5f6b94;
  --moon: #ff9f43;
  --on-moon: #ffffff;
  --line: rgba(35, 48, 90, .14);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 70% at 80% -10%, var(--page-glow) 0%, var(--page) 55%) fixed, var(--page);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--moon); outline-offset: 3px; }

.wrap {
  max-width: 560px; margin: 0 auto;
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; text-align: left; padding: 0; }
.avatar { flex: none; width: 52px; height: 52px; border-radius: 50%; background: var(--card); box-shadow: 0 4px 14px rgba(0,0,0,.18); overflow: hidden; display: grid; place-items: center; border: 3px solid var(--moon); }
.avatar svg { width: 100%; height: 100%; }
.hello { display: flex; flex-direction: column; min-width: 0; }
.hello small { color: var(--muted); font-weight: 700; font-size: .85rem; }
.splash { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #2d3a7a, #131938 70%); color: #fff; animation: splashOut .5s ease 1.5s forwards; }
.splash-in { display: flex; flex-direction: column; align-items: center; gap: 10px; animation: enter .8s cubic-bezier(.2,.9,.3,1.3) both; }
.splash b { font-family: var(--display); font-size: 1.8rem; }
.splash span { opacity: .75; font-size: .9rem; }
@keyframes splashOut { to { opacity: 0; visibility: hidden; } }
.daily { position: relative; display: block; width: 100%; border-radius: 26px; overflow: hidden; margin-bottom: 22px; aspect-ratio: 16 / 10; max-width: 100%; box-shadow: 0 14px 34px rgba(0,0,0,.28); text-align: left; padding: 0; }
.daily svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.daily .tag { position: absolute; top: 14px; left: 14px; background: #ffd98a; color: #131938; font-weight: 800; font-size: .78rem; padding: 6px 12px; border-radius: 99px; }
.daily .info { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 16px 14px; background: linear-gradient(to top, rgba(10,12,30,.75), rgba(10,12,30,0)); color: #fff; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.daily .info b { font-family: var(--display); font-size: 1.3rem; line-height: 1.25; }
.daily .go { flex: none; width: 56px; height: 56px; border-radius: 50%; background: #ffd98a; color: #131938; display: grid; place-items: center; }
.daily .go svg { position: static; width: 26px; height: 26px; margin-left: 3px; }
.stickers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.sticker { aspect-ratio: 1; border-radius: 50%; background: #fff; box-shadow: 0 3px 10px rgba(60,40,80,.15); display: grid; place-items: center; overflow: hidden; border: 3px solid #ffd98a; }
.sticker.empty { background: #efe6f3; border-color: #e6dcec; color: #b8aec8; font-weight: 800; }
.sticker svg { width: 100%; height: 100%; }
.avatars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.avatars button { aspect-ratio: 1; border-radius: 50%; background: #fff; border: 3px solid #e6dcec; overflow: hidden; }
.avatars button[aria-pressed="true"] { border-color: #c2577a; }
.avatars svg { width: 100%; height: 100%; }
.name-input { height: 54px; border-radius: 16px; border: 2px solid #e6dcec; padding: 0 16px; font: inherit; font-size: 1.1rem; color: #2a2440; background: #fff; }
.reward { position: fixed; inset: 0; z-index: 65; display: grid; place-items: center; background: rgba(4,6,20,.6); }
.reward-card { width: min(86vw, 340px); background: #fbf6ee; border-radius: 30px; padding: 26px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; color: #2a2440; text-align: center; animation: enter .6s cubic-bezier(.2,.9,.3,1.4) both; }
.reward-card .sticker { width: 150px; animation: spinIn 1s ease-out both; }
.reward-card h3 { font-family: var(--display); margin: 0; font-size: 1.4rem; }
@keyframes spinIn { from { transform: scale(.2) rotate(-200deg); } to { transform: none; } }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: 1.45rem; line-height: 1.2; margin: 0; text-wrap: balance; }
.brand svg { flex: none; }
.parent-btn { flex: none; display: flex; align-items: center; gap: 7px; padding: 10px 14px; border-radius: 999px; background: var(--card); color: var(--ink); font-size: .85rem; font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.test-banner { margin: -4px 0 16px; padding: 10px 14px; border-radius: 14px; background: #e3f7e8; color: #1f6b3a; font-size: .85rem; font-weight: 600; line-height: 1.4; }

.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; border-radius: 22px; background: var(--card); margin-bottom: 22px; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
.modes button { display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: 16px; font-weight: 700; font-size: .95rem; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--moon); color: var(--on-moon); }

.shelf { margin-bottom: 26px; }
.shelf h2 { font-family: var(--display); font-weight: 800; font-size: 1.15rem; margin: 0 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.shelf h2 small { font-family: var(--body); font-weight: 400; font-size: .78rem; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.tile { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 0; text-align: left; transition: transform .15s ease; }
.tile:active { transform: scale(.96); }
.tile .art { aspect-ratio: 1 / 1; max-width: 100%; border-radius: 22px; overflow: hidden; box-shadow: 0 10px 24px rgba(0,0,0,.25); }
.tile .art svg { display: block; width: 100%; height: 100%; }
.tile .name { font-family: var(--display); font-weight: 600; font-size: 1rem; line-height: 1.3; padding-inline: 4px; }
.tile .len { padding-inline: 4px; font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile.locked .art { filter: saturate(.6) brightness(.82); }
.badge { position: absolute; top: 10px; right: 10px; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: rgba(19, 25, 56, .7); }
.badge.soon { width: auto; padding: 0 10px; border-radius: 999px; height: 28px; font-size: .72rem; font-weight: 700; color: #fff; background: rgba(19, 25, 56, .75); }
.tile .done { font-weight: 700; color: #3aa860; }
.answers#timer { grid-template-columns: repeat(4, 1fr); }
.badge.free { width: auto; padding: 0 10px; border-radius: 999px; height: 28px; font-size: .72rem; font-weight: 700; color: #131938; background: #ffd98a; }
.weekly { margin-top: 4px; padding: 14px 16px; border-radius: 18px; border: 1px dashed var(--line); color: var(--muted); font-size: .9rem; line-height: 1.5; }
.still * { animation-play-state: paused !important; }

/* ---------- full-screen player: the picture is the whole screen ---------- */
.player { position: fixed; inset: 0; z-index: 20; background: #131938; overflow: hidden; }
.stage { position: absolute; inset: 0; }
.stage .layer { position: absolute; inset: 0; transition: opacity .6s ease; }
.stage .layer.in { }
.stage .layer svg { display: block; width: 100%; height: 100%; overflow: visible; }
.stage .layer svg > .cam { animation: cam 10s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 50% 50%; }
.player-top {
  position: absolute; z-index: 2; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.round { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: rgba(19, 25, 56, .45); color: #fff; backdrop-filter: blur(6px); }
.controls {
  position: absolute; z-index: 2; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding-top: 70px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, rgba(10, 12, 30, .72), rgba(10, 12, 30, 0));
  color: #fff;
}
.controls > * { width: 100%; max-width: 460px; }
.controls h2 { font-family: var(--display); font-weight: 800; font-size: 1.5rem; margin: 0; text-align: center; text-wrap: balance; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
.bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.25); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: #ffd98a; border-radius: inherit; }
.times { display: flex; justify-content: space-between; font-size: .8rem; font-variant-numeric: tabular-nums; margin-top: -8px; opacity: .85; }
.play { width: 88px !important; height: 88px; border-radius: 50%; display: grid; place-items: center; background: #ffd98a; color: #131938; box-shadow: 0 0 0 9px rgba(255, 217, 138, .22), 0 6px 30px rgba(0,0,0,.35); }
.play:active { transform: scale(.95); }
.transport { display: flex; align-items: center; justify-content: center; gap: 28px; }
.skip { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.18); color: #fff; }
.skip:active { transform: scale(.92); }
.sleep-hint { font-size: .8rem; text-align: center; opacity: .8; }

.night { position: fixed; inset: 0; z-index: 30; background: #04050d; display: grid; place-items: center; color: #3b4170; font-size: .85rem; text-align: center; padding: 24px; }
.night .z { font-family: var(--display); font-size: 2rem; opacity: .6; animation: breathe 4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .2; } }

/* ---------- living-picture motions ---------- */
.eye, .ears, .tail, .sway, .twinkle, .glow, .flap, .neck, .nod, .breathe, .sad, .idle, .arm, .flicker, .roar, .dance, .sit, .wings, .laugh, .bob, .hop { transform-box: fill-box; }
.eye { transform-origin: center; animation: blink 4.5s infinite; }
.ears { transform-origin: 50% 100%; animation: wiggle 1.8s ease-in-out infinite; }
.tail { transform-origin: 80% 100%; animation: wag .7s ease-in-out infinite alternate; }
.sway { transform-origin: 50% 100%; animation: sway 2s ease-in-out infinite alternate; }
.cloud { animation: drift 18s linear infinite; }
.spin { animation: spin 24s linear infinite; }
.twinkle { transform-origin: center; animation: twinkle 2.2s ease-in-out infinite; }
.glow { transform-origin: center; animation: glow 2.6s ease-in-out infinite alternate; }
.flap { transform-origin: 0 50%; animation: flap .7s ease-in-out infinite alternate; }
.zf { animation: zf 3s ease-out infinite; }
.neck { transform-origin: 50% 100%; }
.wind { animation: windgo 4s linear infinite; }
.flicker { transform-origin: 50% 100%; animation: flicker .45s ease-in-out infinite alternate; }
.drip { animation: drip 1.1s ease-in infinite; }
.fall { animation: fall 4.2s linear infinite; }
.flyaway { animation: flyaway 4.5s ease-in .8s both; }
.flutter { animation: flutter 6.5s ease-in-out infinite; }
.wings { transform-origin: 50% 50%; animation: wingflap .22s ease-in-out infinite alternate; }
.flyby { animation: flyby 9s linear infinite; }
.firefly { animation: firefly 5s ease-in-out infinite; }
.shoot { animation: shoot 9s ease-in infinite; }

.enter { animation: enter .55s cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes enter { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.idle { transform-origin: 50% 100%; animation: breath 2.2s ease-in-out infinite; }
.bob { transform-origin: 50% 100%; animation: bob .8s ease-in-out infinite; }
.hop { transform-origin: 50% 100%; animation: hop .7s ease-in-out infinite; }
.laugh { transform-origin: 50% 100%; animation: laugh .4s ease-in-out infinite; }
.nod { transform-origin: 50% 100%; animation: nod 1.2s ease-in-out infinite; }
.breathe { transform-origin: 50% 100%; animation: breath 2.8s ease-in-out infinite; }
.run { animation: run 2.2s ease-in .4s both; }
.runin { animation: runin 3.5s ease-out both; }
.walk { animation: walk 8s linear both; }
.walk > * { animation: step .5s ease-in-out infinite; }
@keyframes step { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.sad { transform-origin: 50% 100%; animation: sad 2.4s ease-in-out infinite alternate; }
.sad .neck, .drink .neck { animation: dip 2.2s ease-in-out infinite; }
.lick { animation: lick .5s ease-in-out infinite alternate; }
.rise { animation: rise 1.4s ease-out both; }
.appear { animation: appear 2s ease-out both; }
.roar { transform-origin: 50% 100%; animation: roar 1.6s ease-in-out infinite; }
.stomp { animation: stomp 1.3s ease-in-out infinite; }
.shiver { animation: shiver .22s linear infinite; }
.dance { transform-origin: 50% 100%; animation: dance .5s ease-in-out infinite alternate; }
.sit { transform-origin: 50% 100%; animation: sitdown 1.6s ease-out both; }
.leave { animation: leave 8s ease-in 1s both; }
.poke .arm { transform-origin: 30% 10%; animation: poke .9s ease-in-out infinite alternate; }
.throw .arm { transform-origin: 30% 10%; animation: throwArm 4.5s ease-in-out .3s both; }
.squeeze .arm { transform-origin: 30% 10%; animation: squeeze 1.1s ease-in-out infinite; }
.wave .arm { transform-origin: 30% 10%; animation: waveArm .8s ease-in-out infinite alternate; }


/* ---------- the director's actors: they travel, react and feel ---------- */
.stage .layer svg > .cam.dir { animation: none; }
/* the camera moves the whole picture on the graphics card; the background is painted once */
.stage .camwrap { position: absolute; inset: 0; transform-origin: 0 0; transition: transform 3.2s cubic-bezier(.45,.05,.35,1); will-change: transform; }
.stage .camwrap svg { position: absolute; inset: 0; }
.actor .facing { transition: none; }
.act { transform-origin: 0 0; }
.a-idle { animation: aBreath 3.4s ease-in-out infinite; }
.a-walk { animation: aWalk .62s linear infinite; }
.a-run { animation: aRun .34s linear infinite; }
.a-fly { animation: aFly .9s ease-in-out infinite; }
.a-swim { animation: aSwim 1s ease-in-out infinite; }
.a-jump { animation: aJump .8s ease-out 1, aBreath 2.6s ease-in-out .8s infinite; }
.a-joy { animation: aJump .62s ease-out 2, aBreath 2.6s ease-in-out 1.3s infinite; }
.a-pop { animation: aPop .5s cubic-bezier(.3,1.6,.5,1) 1, aBreath 2.6s ease-in-out .5s infinite; }
.a-sleep { animation: aSleep 3.6s ease-in-out infinite; }
.a-sit { animation: aSit .8s ease-out both; }
.a-eat { animation: aEat .34s ease-in-out infinite alternate; }
.a-dance { animation: aDance .5s ease-in-out infinite alternate; }
.a-sing { animation: aSing 1s ease-in-out infinite alternate; }
.a-talk { animation: aTalk .9s ease-in-out infinite alternate; }
.a-look { animation: aLook 2.6s ease-in-out infinite; }
.a-think { animation: aThink 3s ease-in-out infinite alternate; }
.a-work { animation: aWork .5s ease-in-out infinite alternate; }
.a-wave { animation: aWave .4s ease-in-out infinite alternate; }
.a-hug { animation: aHug 1s ease-in-out infinite; }
.a-shiver { animation: aShiver .12s linear infinite; }
.a-sad { animation: aSad 1.2s ease-out both; }
.a-stomp { animation: aStomp .5s ease-in-out infinite; }
@keyframes aBreath { 50% { transform: scale(1.006, 1.02); } }
@keyframes aWalk { 0%, 100% { transform: rotate(-4deg); } 25%, 75% { transform: translateY(-3.5px) rotate(0); } 50% { transform: rotate(4deg); } }
@keyframes aRun { 0%, 100% { transform: rotate(5deg) scale(1.04, .96); } 50% { transform: translateY(-7px) rotate(9deg) scale(.97, 1.04); } }
@keyframes aFly { 50% { transform: translateY(-8px) rotate(-4deg); } }
@keyframes aSwim { 50% { transform: translateY(-3px) rotate(-6deg); } }
@keyframes aJump { 0% { transform: scale(1.1, .88); } 40% { transform: translateY(-24px) scale(.94, 1.08); } 75% { transform: scale(1.08, .9); } 100% { transform: none; } }
@keyframes aPop { 0% { transform: scale(1); } 40% { transform: translateY(-8px) scale(.94, 1.1); } 100% { transform: none; } }
@keyframes aSleep { 0%, 100% { transform: scale(1.02, .95); } 50% { transform: scale(1.04, .98); } }
@keyframes aSit { to { transform: scale(1.06, .86); } }
@keyframes aEat { to { transform: rotate(5deg) scale(1.02, .97); } }
@keyframes aDance { from { transform: rotate(-8deg); } to { transform: translateY(-6px) rotate(8deg); } }
@keyframes aSing { from { transform: rotate(-3deg); } to { transform: rotate(4deg) scale(1, 1.03); } }
@keyframes aTalk { to { transform: scale(1.005, 1.025) rotate(-1deg); } }
@keyframes aLook { 0%, 40% { transform: none; } 50%, 90% { transform: scaleX(-1); } }
@keyframes aThink { from { transform: rotate(-2deg); } to { transform: rotate(-6deg); } }
@keyframes aWork { from { transform: rotate(3deg); } to { transform: rotate(10deg) scale(1, .96); } }
@keyframes aWave { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
@keyframes aHug { 50% { transform: scale(1.05, .95); } }
@keyframes aShiver { 25% { transform: translateX(-1.4px); } 75% { transform: translateX(1.4px); } }
@keyframes aSad { to { transform: translateY(2px) rotate(-5deg) scale(1, .95); } }
@keyframes aStomp { 50% { transform: translateY(-4px) rotate(-3deg); } }
.build.grow { transition: transform 1.4s cubic-bezier(.3,1.4,.5,1); }
.bpart { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; transform: scale(.3); transition: opacity .5s, transform .7s cubic-bezier(.3,1.5,.5,1); }
.bpart.on { opacity: 1; transform: none; }
.fx-pop { transform-box: fill-box; transform-origin: 50% 100%; animation: fxPop .45s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes fxPop { from { transform: scale(0); opacity: 0; } }
.dot { animation: twinkle .9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.puff { transform-box: fill-box; transform-origin: center; animation: puffOut .45s ease-out infinite; }
@keyframes puffOut { from { transform: scale(.4); opacity: .9; } to { transform: scale(1.4) translateY(-4px); opacity: 0; } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@keyframes wiggle { 0%, 60%, 100% { transform: rotate(0); } 72% { transform: rotate(-10deg); } 86% { transform: rotate(7deg); } }
@keyframes wag { from { transform: rotate(-10deg); } to { transform: rotate(12deg); } }
@keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
@keyframes drift { from { transform: translateX(-90px); } to { transform: translateX(260px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes twinkle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .25; transform: scale(.55); } }
@keyframes glow { from { filter: drop-shadow(0 0 2px #ffd98a); } to { filter: drop-shadow(0 0 12px #ffd98a); } }
@keyframes flap { from { transform: skewY(0); } to { transform: skewY(-10deg) scaleX(.88); } }
@keyframes zf { 0% { transform: translate(0, 0); opacity: 0; } 20% { opacity: .95; } 100% { transform: translate(14px, -30px); opacity: 0; } }
@keyframes windgo { from { transform: translateX(-120px); opacity: 0; } 30% { opacity: .8; } to { transform: translateX(230px); opacity: 0; } }
@keyframes flicker { from { transform: scale(.92, .86) skewX(-3deg); } to { transform: scale(1.04, 1.1) skewX(3deg); } }
@keyframes drip { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(26px); opacity: 0; } }
@keyframes fall { 0% { transform: translate(0, -60px) rotate(0); opacity: 0; } 10% { opacity: 1; } 50% { transform: translate(18px, 60px) rotate(180deg); } 100% { transform: translate(-6px, 190px) rotate(360deg); opacity: 0; } }
@keyframes flyaway { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(110px, -190px) scale(.35); opacity: .6; } }
@keyframes flutter { 0%, 100% { transform: translate(0, 0); } 20% { transform: translate(40px, -26px); } 45% { transform: translate(90px, 4px); } 70% { transform: translate(50px, 30px); } 85% { transform: translate(10px, 12px); } }
@keyframes wingflap { from { transform: scaleX(1); } to { transform: scaleX(.25); } }
@keyframes flyby { 0% { transform: translate(-60px, 0); } 25% { transform: translate(10px, -8px); } 50% { transform: translate(80px, 4px); } 75% { transform: translate(150px, -6px); } 100% { transform: translate(260px, 2px); } }

<script>
// =====================================================================
// Cartoon kit: dark plum outline, flat colour + one shade + one highlight, big shiny eyes
// =====================================================================
const INK = '#3b2a4a';
const O = (w = 2.2) => `stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
// MOOD is set by the director while it draws a character: the same eyes laugh, cry, get scared or fall asleep
let MOOD = '';
const eye = (x, y, closed, r = 4.4) => {
  if (closed || MOOD === 'sleep') return `<path d="M${x - r} ${y} q${r} ${r * .9} ${r * 2} 0" ${O(1.9)} fill="none"/><path d="M${x - r + .5} ${y + .8} l-2 1.6 M${x + r - .5} ${y + .8} l2 1.6" ${O(1.4)}/>`;
  if (MOOD === 'happy' || MOOD === 'love') return `<path d="M${x - r} ${y + r * .3} q${r} ${-r * 1.7} ${r * 2} 0" ${O(2.1)} fill="none"/>`;
  if (MOOD === 'sad' || MOOD === 'angry') {
    const top = y - r * .15;
    return `<path d="M${x - r * .9} ${top} h${r * 1.8} a${r * .9} ${r * .85} 0 0 1 ${-r * 1.8} 0z" fill="#fff" ${O(1.6)}/><circle cx="${x + .3}" cy="${top + r * .38}" r="${r * .44}" fill="#2a1f3a"/>
      ${MOOD === 'angry' ? `<path d="M${x - r * 1.1} ${top - r * .35} h${r * 2.2}" ${O(2.4)}/>` : ''}`;
  }
  const big = MOOD === 'surprised' || MOOD === 'scared' ? 1.22 : 1, pr = big > 1 ? .36 : .58;
  return `<g class="eye"><ellipse cx="${x}" cy="${y}" rx="${r * .86 * big}" ry="${r * big}" fill="#fff" ${O(1.6)}/><circle cx="${x + .7}" cy="${y + .7}" r="${r * pr}" fill="#2a1f3a"/><circle cx="${x + 1.7}" cy="${y - .9}" r="${r * .26}" fill="#fff"/><circle cx="${x - .4}" cy="${y + 1.9}" r="${r * .12}" fill="#fff"/></g>`;
};
const blush = (x, y, r = 3.4) => `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * .62}" fill="#ff8fa8" opacity=".55"/>`;
const shadow = (x, y, rx) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${rx * .18}" fill="#1a1030" opacity=".18"/>`;
const SKIN = '#f2c9a0';

// things a character can hold in the raised hand (hand at local 43,59)
const HOLD = {
  stick: `<path d="M43 59 L64 76" stroke="#6a4030" stroke-width="3.4" stroke-linecap="round"/>`,
  axe: `<path d="M43 62 L46 30" stroke="#8a5a34" stroke-width="3.4" stroke-linecap="round"/><path d="M44 30 q8 -4 10 4 q-6 0 -9 4z" fill="#c9cfe0" ${O(1.4)}/>`,
  cheese: `<g transform="translate(46 56)"><path d="M-7 4 L7 -4 L9 6 L-5 9z" fill="#ffe08a" ${O(1.4)}/><circle cx="2" cy="3" r="1.3" fill="#f0c25a"/></g>`,
  stone: `<circle cx="46" cy="57" r="7" fill="#a0a4b8" ${O(1.6)}/>`,
  bird: `<g transform="translate(40 50)"><ellipse cx="6" cy="6" rx="6" ry="4.5" fill="#7ab8f0" ${O(1.2)}/><circle cx="11" cy="3" r="3.4" fill="#7ab8f0" ${O(1.2)}/><path d="M14 3 l4 1 l-4 1.4z" fill="#ffb347"/></g>`,

  const starts = TIMINGS[id]?.starts, total = TIMINGS[id]?.duration || audio.duration || 0;
  if (!starts) return 0;
  // exact: the voice recording knows when every sentence starts
  const exact = TIMINGS[id].sents?.[pi];
  if (exact && exact.length === para.beats.length) { let bi = 0; while (bi + 1 < exact.length && exact[bi + 1] <= time + .05) bi++; return bi; }
  const a = starts[pi], z = starts[pi + 1] ?? total;
  const sum = para.weights.reduce((x, y) => x + y, 0);
  let acc = 0, bi = 0;
  for (let b = 0; b < para.weights.length; b++) { if (a + (z - a) * acc / sum <= time + .1) bi = b; acc += para.weights[b]; }
  return bi;
}

function tone(freqs, len = .09, gap = .07) {
  if (!sounds) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, k) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + k * gap;
      o.type = 'sine'; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + len);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + len + .02);
    });
  } catch {}
}

  world: ['teddy_waltz', 'carefree', 'sugar_plum', 'merry_go', 'rainbows', 'monkeys'],
  short: ['monkeys', 'fluffing_duck', 'cheery_monday', 'onion_capers', 'doobly_doo', 'carefree'],
};
const MUSIC_VOL = { sleep: .17, ge: .22, world: .22, short: .22 };
const MUSIC_CREDITS = 'Carefree, Monkeys Spinning Monkeys, Teddy Bear Waltz, Rainbows, Cheery Monday, Merry Go, Music Box Theme, Village Consort, Galway, Fluffing a Duck, Onion Capers, Doobly Doo, Dance of the Sugar Plum Fairy, Dreamer, Morning, Evening, Fireflies and Stardust, Friday Morning, Magic Scout – Farm, Magic Scout – Northern Glade, Almost Bliss — Kevin MacLeod (incompetech.com), Creative Commons: By Attribution 4.0';
const MUSIC = { el: null, gain: null, tale: null, list: [], at: 0, timer: 1, playing: false };
function musicEl() {
  if (MUSIC.el) return MUSIC.el;
  const el = MUSIC.el = new Audio(); el.preload = 'auto';
  el.addEventListener('ended', () => { MUSIC.at = (MUSIC.at + 1) % MUSIC.list.length; el.src = `music/${MUSIC.list[MUSIC.at]}.mp3`; if (MUSIC.playing) el.play().catch(() => {}); });
  // through Web Audio, so the level can be set on phones too (iOS ignores element volume)
  try { const c = sndInit(); const src = c.createMediaElementSource(el); MUSIC.gain = c.createGain(); MUSIC.gain.gain.value = 0; src.connect(MUSIC.gain).connect(SND.master); } catch { MUSIC.gain = null; }
  return el;
}
function setMusicGain(v, slow) {
  if (MUSIC.gain && SND.ctx) MUSIC.gain.gain.setTargetAtTime(v, SND.ctx.currentTime, slow ? 1.2 : .3);
  else if (MUSIC.el) MUSIC.el.volume = Math.min(1, v * 3);
}
function musicStart(tale) {
  if (!sndInit()) return;
  const el = musicEl();
  if (MUSIC.tale !== tale.id) {
    const base = PLAYLISTS[tale.cat] || PLAYLISTS.world;
    const k = hashOf(tale.id) % base.length;
    MUSIC.list = base.slice(k).concat(base.slice(0, k)); MUSIC.at = 0; MUSIC.tale = tale.id;
    el.src = `music/${MUSIC.list[0]}.mp3`;
  }
  MUSIC.playing = true; MUSIC.vol = MUSIC_VOL[tale.cat] || .26;
  if (musicOn) { el.play().catch(() => {}); setMusicGain(MUSIC.vol, true); }
}
function musicPause(stop) {
  MUSIC.playing = false;
  if (!MUSIC.el) return;
  setMusicGain(0);
  if (SND.amb && SND.ctx) SND.amb.gain.setTargetAtTime(0, SND.ctx.currentTime, .4);
  const el = MUSIC.el;
  setTimeout(() => { if (!MUSIC.playing) el.pause(); }, 700);
  if (stop) { MUSIC.tale = null; ambStop(); }
}
// the sleep timer and the end of the tale fade the music with the voice
function musicLevel(v) { if (MUSIC.playing) { if (musicOn && MUSIC.el.paused) MUSIC.el.play().catch(() => {}); setMusicGain(musicOn ? MUSIC.vol * v : 0); } }

// ---------- ambience: what the place sounds like ----------
const AMB = { nodes: [], timers: [], kind: '' };
function ambStop() { AMB.nodes.forEach(n => { try { n.stop(); } catch {} }); AMB.timers.forEach(clearInterval); AMB.nodes = []; AMB.timers = []; AMB.kind = ''; }
function noiseLoop(filterType, freq, q, gain, lfoHz = 0, lfoDepth = 0) {
  const c = SND.ctx, src = c.createBufferSource(); src.buffer = SND.noise; src.loop = true;
  const f = c.createBiquadFilter(); f.type = filterType; f.frequency.value = freq; f.Q.value = q;
  const g = c.createGain(); g.gain.value = gain;
  src.connect(f).connect(g).connect(SND.amb); src.start();
  if (lfoHz) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = lfoHz; lg.gain.value = lfoDepth; l.connect(lg).connect(g.gain); l.start(); AMB.nodes.push(l); }
  AMB.nodes.push(src);
}
const chirp = () => { const c = SND.ctx, t = c.currentTime + .05, f0 = 2600 + Math.random() * 1600, n = 2 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) { const o = c.createOscillator(), g = c.createGain(), s = t + i * .11; o.type = 'sine'; o.frequency.setValueAtTime(f0, s); o.frequency.exponentialRampToValueAtTime(f0 * (1.3 + Math.random() * .3), s + .06); env(g, s, .05, .005, .07); o.connect(g).connect(SND.amb); o.start(s); o.stop(s + .1); } };
const cricket = () => { const c = SND.ctx, t = c.currentTime + .05; for (let i = 0; i < 3; i++) { const o = c.createOscillator(), g = c.createGain(), s = t + i * .07; o.type = 'triangle'; o.frequency.value = 4600; env(g, s, .025, .004, .035); o.connect(g).connect(SND.amb); o.start(s); o.stop(s + .05); } };
const crackle = () => { const c = SND.ctx, t = c.currentTime + Math.random() * .2, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); src.buffer = SND.noise; f.type = 'highpass'; f.frequency.value = 1800; env(g, t, .12 + Math.random() * .1, .002, .03); src.connect(f).connect(g).connect(SND.amb); src.start(t, Math.random()); src.stop(t + .06); };
const bubble = () => { const c = SND.ctx, t = c.currentTime + .05, o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(400 + Math.random() * 300, t); o.frequency.exponentialRampToValueAtTime(1200, t + .08); env(g, t, .05, .005, .08); o.connect(g).connect(SND.amb); o.start(t); o.stop(t + .12); };
function ambience(kind) {
  if (!sounds || !SND.ctx) return;
  const c = SND.ctx; SND.amb.gain.setTargetAtTime(1.6, c.currentTime, .8);
  if (kind === AMB.kind) return;
  ambStop(); AMB.kind = kind;
  const every = (fn, min, max) => { const tick = () => { if (Math.random() < .5) fn(); }; AMB.timers.push(setInterval(tick, min + Math.random() * (max - min))); };
  switch (kind) {
    case 'birds': every(chirp, 1400, 2600); noiseLoop('bandpass', 500, .6, .012, .1, .006); break;
    case 'crickets': every(cricket, 700, 1100); break;
    case 'waves': noiseLoop('lowpass', 700, .7, .05, .12, .04); break;
    case 'water': noiseLoop('bandpass', 1100, 1.2, .025, .6, .01); every(bubble, 900, 1800); break;
    case 'underwater': noiseLoop('lowpass', 300, 1, .05, .2, .02); every(bubble, 500, 1000); break;
    case 'fire': noiseLoop('lowpass', 400, .7, .02); every(crackle, 180, 420); break;
    case 'rain': noiseLoop('highpass', 1400, .5, .05, 1.3, .01); break;
    case 'wind': noiseLoop('bandpass', 420, 1.4, .05, .15, .035); break;
  }
}
const ambOf = q => q.weather === 'rain' ? 'rain' : q.weather === 'wind' || q.weather === 'snow' || q.bg === 'snow' || q.bg === 'wintervillage' || q.bg === 'mountain' && q.time !== 'night' ? 'wind'
  : q.bg === 'sea' || q.bg === 'beach' ? 'waves' : q.bg === 'underwater' ? 'underwater' : /river|pond|bridge|swamp/.test(q.bg) ? 'water'
  : /hut|kitchen/.test(q.bg) || (q.props || []).some(p => p === 'hearth' || p === 'campfire') ? 'fire'
  : /meadow|forest|garden|orchard|village|yard|field|vineyard|road|pine|castle|palace|mountain|darkforest|cave/.test(q.bg) ? (q.time === 'night' || q.time === 'evening' || q.bg === 'darkforest' ? 'crickets' : 'birds') : '';

// ---------- cartoon sound effects, one or two per sentence ----------
function sweep(type, f0, f1, t, len, vel) { const c = SND.ctx, o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + len); env(g, t, vel, .01, len); o.connect(g).connect(SND.fx); o.start(t); o.stop(t + len + .05); }
function whoosh(t, len = .45, up = true) { const c = SND.ctx, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); src.buffer = SND.noise; f.type = 'bandpass'; f.Q.value = 1.5; f.frequency.setValueAtTime(up ? 400 : 1600, t); f.frequency.exponentialRampToValueAtTime(up ? 1800 : 400, t + len); env(g, t, .18, len * .4, len * .6); src.connect(f).connect(g).connect(SND.fx); src.start(t); src.stop(t + len + .05); }
const SFX = {
  steps: (t, dur) => { for (let s = 0; s < Math.min(dur, 3); s += .32) sweep('triangle', 150, 90, t + s, .07, .07); },
  run: (t, dur) => { whoosh(t, .5); for (let s = .1; s < Math.min(dur, 2); s += .17) sweep('triangle', 170, 100, t + s, .05, .05); },
  fly: t => whoosh(t, .7), swim: t => { bubble(); whoosh(t, .6, false); },
  jump: t => sweep('sine', 260, 720, t, .18, .12), joy: t => { sweep('sine', 300, 760, t, .16, .1); sweep('sine', 300, 760, t + .62, .16, .08); },
  pop: t => { sweep('sine', 500, 1300, t, .1, .12); }, bang: t => { sweep('square', 880, 1320, t, .08, .03); sweep('sine', 660, 990, t + .06, .12, .1); },
  sparks: t => [1568, 1976, 2349, 3136].forEach((f, k) => sweep('sine', f, f, t + k * .07, .25, .05)),
  hearts: t => [988, 1319].forEach((f, k) => sweep('sine', f, f, t + k * .14, .5, .07)),
  tears: t => [659, 587, 523].forEach((f, k) => sweep('triangle', f, f * .98, t + k * .22, .4, .06)),
  sweat: t => { for (let k = 0; k < 4; k++) sweep('sine', 900, 760, t + k * .06, .05, .04); },
  zzz: t => [392, 330].forEach((f, k) => sweep('sine', f, f, t + k * .5, 1.2, .05)),
  idea: t => sweep('sine', 1760, 1760, t, .6, .1), notes: t => [784, 988, 1175].forEach((f, k) => sweep('triangle', f, f, t + k * .16, .3, .05)),
  build: t => { sweep('sine', 400, 900, t, .1, .1); sweep('sine', 1319, 1319, t + .1, .3, .05); },
  puff: t => whoosh(t, .3, false), ask: t => sweep('sine', 500, 800, t, .25, .07), yum: t => [300, 360].forEach((f, k) => sweep('triangle', f, f * .9, t + k * .15, .1, .07)),
};
function beatSounds(para, bi) {
  if (!sounds || !SND.ctx || !MUSIC.playing) return;
  const t = SND.ctx.currentTime + .05, beat = para.beats[bi], prev = bi ? para.beats[bi - 1] : null;
  const want = [];
  beat.actors.forEach((p, k) => {
    const was = prev?.actors[k] || para.start[k];
    if (p.dur && p.on) want.push([p.act === 'run' ? 'run' : p.act === 'fly' ? 'fly' : p.act === 'swim' ? 'swim' : p.act === 'jump' ? 'jump' : 'steps', p.dur]);
    else if (p.act === 'joy' && was.act !== 'joy') want.push(['joy']);
    else if (p.act === 'pop') want.push(['pop']);
    p.fx.forEach(f => { if (!was.fx.includes(f) && SFX[f]) want.push([f]); });
  });
  if (para.build) want.push(['build']);
  want.slice(0, 2).forEach(([name, dur], k) => SFX[name](t + k * .15, dur || 1));
}

// ---------- parent settings ----------
$('parentBtn').onclick = () => gate(() => {
  openSheet(`
    <h3>პარამეტრები</h3>
    <div class="row"><span>ზღაპრები ზედიზედ<br><small style="color:#7a7290">ერთი რომ დამთავრდება, შემდეგი დაიწყება</small></span>
      <button class="switch" id="chainSw" role="switch" aria-checked="${chain}" aria-label="ზღაპრები ზედიზედ"></button></div>
    <div class="row"><span>ძილის ტაიმერი<br><small style="color:#7a7290">ხმა ნელა ჩაქრება და ზღაპარი გაჩერდება</small></span></div>
    <div class="answers" id="timer">${[0, 15, 30, 45].map(m => `<button data-min="${m}" style="font-size:1rem;height:52px;${m === sleepMin ? 'background:#c2577a;color:#fff' : ''}">${m ? m + ' წთ' : 'გამორთ.'}</button>`).join('')}</div>
    <div class="row"><span>მუსიკა<br><small style="color:#7a7290">ნაზი მელოდია ზღაპრის დროს</small></span>
      <button class="switch" id="musicSw" role="switch" aria-checked="${musicOn}" aria-label="მუსიკა"></button></div>
    <div class="row"><span>ხმოვანი ეფექტები<br><small style="color:#7a7290">ჩიტები, ტალღები, ნაბიჯები და შეხების ხმა</small></span>
      <button class="switch" id="soundSw" role="switch" aria-checked="${sounds}" aria-label="ხმოვანი ეფექტები"></button></div>
    <div class="row"><span>სატესტო რეჟიმი<br><small style="color:#7a7290">ყველა ზღაპარი ღიაა გადახდის გარეშე</small></span>
      <button class="switch" id="testSw" role="switch" aria-checked="${testMode}" aria-label="სატესტო რეჟიმი"></button></div>
    <p style="font-size:.72rem;color:#7a7290;line-height:1.4;margin:6px 0 10px">მუსიკა: ${MUSIC_CREDITS}</p>
    <button class="cta" data-sub>გამოწერა — 3 დღე უფასოდ</button>
    <button class="link" data-close>დახურვა</button>`);
  $('sheet').onclick = e => {
    if (e.target.closest('[data-close]')) return closeSheet();
    if (e.target.closest('#chainSw')) { chain = !chain; store.set('chain', chain); $('chainSw').setAttribute('aria-checked', chain); }
    if (e.target.closest('#soundSw')) { sounds = !sounds; store.set('sounds', sounds); $('soundSw').setAttribute('aria-checked', sounds); if (!sounds) ambStop(); }
    if (e.target.closest('#musicSw')) { musicOn = !musicOn; store.set('music', musicOn); $('musicSw').setAttribute('aria-checked', musicOn); musicLevel(1); }
    if (e.target.closest('#testSw')) { testMode = !testMode; store.set('test', testMode); $('testSw').setAttribute('aria-checked', testMode); renderShelves(); }
    const m = e.target.closest('[data-min]');
    if (m) { sleepMin = +m.dataset.min; store.set('sleepMin', sleepMin); sleepAt = 0; $('timer').querySelectorAll('button').forEach(b => { const on = +b.dataset.min === sleepMin; b.style.background = on ? '#c2577a' : ''; b.style.color = on ? '#fff' : ''; }); }
    if (e.target.closest('[data-sub]')) paywall();
  };
});

function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 3200);
}
