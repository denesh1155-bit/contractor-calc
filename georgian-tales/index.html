<title>ქართული ზღაპრები</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700&family=Noto+Serif+Georgian:wght@600;800&display=swap">
<style>
/* Layout: phone-first storybook — mode switch, shelves of picture tiles by category, full-screen player where the living picture fills the whole screen and controls float on top */
:root {
  --page: #131938;
  --page-glow: #2d3a7a;
  --card: #1c2450;
  --ink: #f7efe0;
  --muted: #a9aed6;
  --moon: #ffd98a;
  --on-moon: #131938;
  --line: rgba(247, 239, 224, .14);
  --display: "Noto Serif Georgian", "Sylfaen", Georgia, serif;
  --body: "Noto Sans Georgian", "Sylfaen", system-ui, sans-serif;
  color-scheme: dark;
}
:root.day {
  --page: #dff1ff;
  --page-glow: #fff3d6;
  --card: #ffffff;
  --ink: #23305a;
  --muted: #5f6b94;
  --moon: #ff9f43;
  --on-moon: #ffffff;
  --line: rgba(35, 48, 90, .14);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 70% at 80% -10%, var(--page-glow) 0%, var(--page) 55%) fixed, var(--page);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--moon); outline-offset: 3px; }

.wrap {
  max-width: 560px; margin: 0 auto;
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; text-align: left; padding: 0; }
.avatar { flex: none; width: 52px; height: 52px; border-radius: 50%; background: var(--card); box-shadow: 0 4px 14px rgba(0,0,0,.18); overflow: hidden; display: grid; place-items: center; border: 3px solid var(--moon); }
.avatar svg { width: 100%; height: 100%; }
.hello { display: flex; flex-direction: column; min-width: 0; }
.hello small { color: var(--muted); font-weight: 700; font-size: .85rem; }
.splash { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #2d3a7a, #131938 70%); color: #fff; animation: splashOut .5s ease 1.5s forwards; }
.splash-in { display: flex; flex-direction: column; align-items: center; gap: 10px; animation: enter .8s cubic-bezier(.2,.9,.3,1.3) both; }
.splash b { font-family: var(--display); font-size: 1.8rem; }
.splash span { opacity: .75; font-size: .9rem; }
@keyframes splashOut { to { opacity: 0; visibility: hidden; } }
.daily { position: relative; display: block; width: 100%; border-radius: 26px; overflow: hidden; margin-bottom: 22px; aspect-ratio: 16 / 10; max-width: 100%; box-shadow: 0 14px 34px rgba(0,0,0,.28); text-align: left; padding: 0; }
.daily svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.daily .tag { position: absolute; top: 14px; left: 14px; background: #ffd98a; color: #131938; font-weight: 800; font-size: .78rem; padding: 6px 12px; border-radius: 99px; }
.daily .info { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 16px 14px; background: linear-gradient(to top, rgba(10,12,30,.75), rgba(10,12,30,0)); color: #fff; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.daily .info b { font-family: var(--display); font-size: 1.3rem; line-height: 1.25; }
.daily .go { flex: none; width: 56px; height: 56px; border-radius: 50%; background: #ffd98a; color: #131938; display: grid; place-items: center; }
.daily .go svg { position: static; width: 26px; height: 26px; margin-left: 3px; }
.stickers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.sticker { aspect-ratio: 1; border-radius: 50%; background: #fff; box-shadow: 0 3px 10px rgba(60,40,80,.15); display: grid; place-items: center; overflow: hidden; border: 3px solid #ffd98a; }
.sticker.empty { background: #efe6f3; border-color: #e6dcec; color: #b8aec8; font-weight: 800; }
.sticker svg { width: 100%; height: 100%; }
.avatars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.avatars button { aspect-ratio: 1; border-radius: 50%; background: #fff; border: 3px solid #e6dcec; overflow: hidden; }
.avatars button[aria-pressed="true"] { border-color: #c2577a; }
.avatars svg { width: 100%; height: 100%; }
.name-input { height: 54px; border-radius: 16px; border: 2px solid #e6dcec; padding: 0 16px; font: inherit; font-size: 1.1rem; color: #2a2440; background: #fff; }
.reward { position: fixed; inset: 0; z-index: 65; display: grid; place-items: center; background: rgba(4,6,20,.6); }
.reward-card { width: min(86vw, 340px); background: #fbf6ee; border-radius: 30px; padding: 26px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; color: #2a2440; text-align: center; animation: enter .6s cubic-bezier(.2,.9,.3,1.4) both; }
.reward-card .sticker { width: 150px; animation: spinIn 1s ease-out both; }
.reward-card h3 { font-family: var(--display); margin: 0; font-size: 1.4rem; }
@keyframes spinIn { from { transform: scale(.2) rotate(-200deg); } to { transform: none; } }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: 1.45rem; line-height: 1.2; margin: 0; text-wrap: balance; }
.brand svg { flex: none; }
.parent-btn { flex: none; display: flex; align-items: center; gap: 7px; padding: 10px 14px; border-radius: 999px; background: var(--card); color: var(--ink); font-size: .85rem; font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.test-banner { margin: -4px 0 16px; padding: 10px 14px; border-radius: 14px; background: #e3f7e8; color: #1f6b3a; font-size: .85rem; font-weight: 600; line-height: 1.4; }

.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; border-radius: 22px; background: var(--card); margin-bottom: 22px; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
.modes button { display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: 16px; font-weight: 700; font-size: .95rem; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--moon); color: var(--on-moon); }

.shelf { margin-bottom: 26px; }
.shelf h2 { font-family: var(--display); font-weight: 800; font-size: 1.15rem; margin: 0 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.shelf h2 small { font-family: var(--body); font-weight: 400; font-size: .78rem; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.tile { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 0; text-align: left; transition: transform .15s ease; }
.tile:active { transform: scale(.96); }
.tile .art { aspect-ratio: 1 / 1; max-width: 100%; border-radius: 22px; overflow: hidden; box-shadow: 0 10px 24px rgba(0,0,0,.25); }
.tile .art svg { display: block; width: 100%; height: 100%; }
.tile .art *, .daily svg * { animation-play-state: paused; }
.tile .art.live *, .daily.live svg * { animation-play-state: running; }
.tile .name { font-family: var(--display); font-weight: 600; font-size: 1rem; line-height: 1.3; padding-inline: 4px; }
.tile .len { padding-inline: 4px; font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile.locked .art { filter: saturate(.6) brightness(.82); }
.badge { position: absolute; top: 10px; right: 10px; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: rgba(19, 25, 56, .7); }
.badge.soon { width: auto; padding: 0 10px; border-radius: 999px; height: 28px; font-size: .72rem; font-weight: 700; color: #fff; background: rgba(19, 25, 56, .75); }
.tile .done { font-weight: 700; color: #3aa860; }
.answers#timer { grid-template-columns: repeat(4, 1fr); }
.badge.free { width: auto; padding: 0 10px; border-radius: 999px; height: 28px; font-size: .72rem; font-weight: 700; color: #131938; background: #ffd98a; }
.weekly { margin-top: 4px; padding: 14px 16px; border-radius: 18px; border: 1px dashed var(--line); color: var(--muted); font-size: .9rem; line-height: 1.5; }
.still * { animation-play-state: paused !important; }

/* ---------- full-screen player: the picture is the whole screen ---------- */
.player { position: fixed; inset: 0; z-index: 20; background: #131938; overflow: hidden; }
.stage { position: absolute; inset: 0; }
.stage .layer { position: absolute; inset: 0; transition: opacity .6s ease; }
.stage .layer.in { }
.stage .layer svg { display: block; width: 100%; height: 100%; overflow: visible; }
.stage .layer svg > .cam { animation: cam 10s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 50% 50%; }
.player-top {
  position: absolute; z-index: 2; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.round { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: rgba(19, 25, 56, .45); color: #fff; backdrop-filter: blur(6px); }
.controls {
  position: absolute; z-index: 2; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding-top: 70px;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, rgba(10, 12, 30, .72), rgba(10, 12, 30, 0));
  color: #fff;
}
.controls > * { width: 100%; max-width: 460px; }
.controls h2 { font-family: var(--display); font-weight: 800; font-size: 1.5rem; margin: 0; text-align: center; text-wrap: balance; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
.bar { position: relative; height: 34px; margin: -10px 0 -6px; touch-action: none; cursor: pointer; }
.bar::before { content: ''; position: absolute; left: 0; right: 0; top: 13px; height: 8px; border-radius: 99px; background: rgba(255,255,255,.25); }
.bar i { position: absolute; left: 0; top: 13px; height: 8px; width: 0; background: #ffd98a; border-radius: 99px; }
.bar b { position: absolute; top: 7px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: #ffd98a; box-shadow: 0 2px 8px rgba(0,0,0,.35); left: 0; }
.bar.drag b { transform: scale(1.25); }
.times { display: flex; justify-content: space-between; font-size: .8rem; font-variant-numeric: tabular-nums; margin-top: -8px; opacity: .85; }
.play { width: 88px !important; height: 88px; border-radius: 50%; display: grid; place-items: center; background: #ffd98a; color: #131938; box-shadow: 0 0 0 9px rgba(255, 217, 138, .22), 0 6px 30px rgba(0,0,0,.35); }
.play:active { transform: scale(.95); }
.transport { display: flex; align-items: center; justify-content: center; gap: 18px; }
.skip { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.18); color: #fff; }
.skip:active { transform: scale(.92); }
.sleep-hint { font-size: .8rem; text-align: center; opacity: .8; }

.night { position: fixed; inset: 0; z-index: 30; background: #04050d; display: grid; place-items: center; color: #3b4170; font-size: .85rem; text-align: center; padding: 24px; }
.night .z { font-family: var(--display); font-size: 2rem; opacity: .6; animation: breathe 4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .2; } }

/* ---------- living-picture motions ---------- */
.eye, .ears, .tail, .sway, .twinkle, .glow, .flap, .neck, .nod, .breathe, .sad, .idle, .arm, .flicker, .roar, .dance, .sit, .wings, .laugh, .bob, .hop { transform-box: fill-box; }
.eye { transform-origin: center; animation: blink 4.5s infinite; }
.ears { transform-origin: 50% 100%; animation: wiggle 1.8s ease-in-out infinite; }
.tail { transform-origin: 80% 100%; animation: wag .7s ease-in-out infinite alternate; }
.sway { transform-origin: 50% 100%; animation: sway 2s ease-in-out infinite alternate; }
.cloud { animation: drift 18s linear infinite; }
.spin { animation: spin 24s linear infinite; }
.twinkle { transform-origin: center; animation: twinkle 2.2s ease-in-out infinite; }
.glow { transform-origin: center; animation: glow 2.6s ease-in-out infinite alternate; }
.flap { transform-origin: 0 50%; animation: flap .7s ease-in-out infinite alternate; }
.zf { animation: zf 3s ease-out infinite; }
.neck { transform-origin: 50% 100%; }
.wind { animation: windgo 4s linear infinite; }
.flicker { transform-origin: 50% 100%; animation: flicker .45s ease-in-out infinite alternate; }
.drip { animation: drip 1.1s ease-in infinite; }
.fall { animation: fall 4.2s linear infinite; }
.flyaway { animation: flyaway 4.5s ease-in .8s both; }
.flutter { animation: flutter 6.5s ease-in-out infinite; }
.wings { transform-origin: 50% 50%; animation: wingflap .22s ease-in-out infinite alternate; }
.flyby { animation: flyby 9s linear infinite; }
.firefly { animation: firefly 5s ease-in-out infinite; }
.shoot { animation: shoot 9s ease-in infinite; }

.enter { animation: enter .55s cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes enter { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.idle { transform-origin: 50% 100%; animation: breath 2.2s ease-in-out infinite; }
.bob { transform-origin: 50% 100%; animation: bob .8s ease-in-out infinite; }
.hop { transform-origin: 50% 100%; animation: hop .7s ease-in-out infinite; }
.laugh { transform-origin: 50% 100%; animation: laugh .4s ease-in-out infinite; }
.nod { transform-origin: 50% 100%; animation: nod 1.2s ease-in-out infinite; }
.breathe { transform-origin: 50% 100%; animation: breath 2.8s ease-in-out infinite; }
.run { animation: run 2.2s ease-in .4s both; }
.runin { animation: runin 3.5s ease-out both; }
.walk { animation: walk 8s linear both; }
.walk > * { animation: step .5s ease-in-out infinite; }
@keyframes step { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.sad { transform-origin: 50% 100%; animation: sad 2.4s ease-in-out infinite alternate; }
.sad .neck, .drink .neck { animation: dip 2.2s ease-in-out infinite; }
.lick { animation: lick .5s ease-in-out infinite alternate; }
.rise { animation: rise 1.4s ease-out both; }
.appear { animation: appear 2s ease-out both; }
.roar { transform-origin: 50% 100%; animation: roar 1.6s ease-in-out infinite; }
.stomp { animation: stomp 1.3s ease-in-out infinite; }
.shiver { animation: shiver .22s linear infinite; }
.dance { transform-origin: 50% 100%; animation: dance .5s ease-in-out infinite alternate; }
.sit { transform-origin: 50% 100%; animation: sitdown 1.6s ease-out both; }
.leave { animation: leave 8s ease-in 1s both; }
.poke .arm { transform-origin: 30% 10%; animation: poke .9s ease-in-out infinite alternate; }
.throw .arm { transform-origin: 30% 10%; animation: throwArm 4.5s ease-in-out .3s both; }
.squeeze .arm { transform-origin: 30% 10%; animation: squeeze 1.1s ease-in-out infinite; }
.wave .arm { transform-origin: 30% 10%; animation: waveArm .8s ease-in-out infinite alternate; }


/* ---------- the director's actors: they travel, react and feel ---------- */
.stage .layer svg > .cam.dir { animation: none; }
/* the camera moves the whole picture on the graphics card; the background is painted once */
.stage .camwrap { position: absolute; inset: 0; transform-origin: 0 0; transition: transform 3.2s cubic-bezier(.45,.05,.35,1); will-change: transform; }
.stage .camwrap svg { position: absolute; inset: 0; }
.actor .facing { transition: none; }
.act { transform-origin: 0 0; }
.a-idle { animation: aBreath 3.4s ease-in-out infinite; }
.a-walk { animation: aWalk .62s linear infinite; }
.a-run { animation: aRun .34s linear infinite; }
.a-fly { animation: aFly .9s ease-in-out infinite; }
.a-swim { animation: aSwim 1s ease-in-out infinite; }
.a-jump { animation: aJump .8s ease-out 1, aBreath 2.6s ease-in-out .8s infinite; }
.a-joy { animation: aJump .62s ease-out 2, aBreath 2.6s ease-in-out 1.3s infinite; }
.a-pop { animation: aPop .5s cubic-bezier(.3,1.6,.5,1) 1, aBreath 2.6s ease-in-out .5s infinite; }
.a-sleep { animation: aSleep 3.6s ease-in-out infinite; }
.a-sit { animation: aSit .8s ease-out both; }
.a-eat { animation: aEat .34s ease-in-out infinite alternate; }
.a-dance { animation: aDance .5s ease-in-out infinite alternate; }
.a-sing { animation: aSing 1s ease-in-out infinite alternate; }
.a-talk { animation: aTalk .9s ease-in-out infinite alternate; }
.a-look { animation: aLook 2.6s ease-in-out infinite; }
.a-think { animation: aThink 3s ease-in-out infinite alternate; }
.a-work { animation: aWork .5s ease-in-out infinite alternate; }
.a-wave { animation: aWave .4s ease-in-out infinite alternate; }
.a-hug { animation: aHug 1s ease-in-out infinite; }
.a-shiver { animation: aShiver .12s linear infinite; }
.a-sad { animation: aSad 1.2s ease-out both; }
.a-stomp { animation: aStomp .5s ease-in-out infinite; }
/* ---------- rigged characters: legs, arms, head, tail and mouth move on their own ----------
   parts: .r-leg1 .r-leg2 (alternate; for four legs diagonal pairs) .r-arm1 (front arm / wing) .r-arm2 (back arm / wing)
   .r-head (turns at the neck) .r-tail .r-body (breathes) .r-mouth > .m-open (opens with the voice) */
.tear { transform-box: fill-box; transform-origin: 50% 0; animation: tearRoll 1.7s ease-in infinite; }
@keyframes tearRoll { 0% { transform: translateY(-1px) scale(.5); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(9px) scale(1.05); opacity: 0; } }
@property --v { syntax: '<number>'; inherits: true; initial-value: 0; }
.r-leg1, .r-leg2, .r-arm1, .r-arm2, .r-head, .r-tail, .r-body, .m-open, .r-ear { transform-box: fill-box; }
.r-leg1, .r-leg2 { transform-origin: 50% 8%; }
.r-arm1, .r-arm2 { transform-origin: 50% 10%; }
.r-head { transform-origin: 50% 92%; animation: hLook 7s ease-in-out infinite; }
.r-tail { animation: rTail 1.5s ease-in-out infinite alternate; }
.r-ear { transform-origin: 50% 100%; animation: rEar 5s ease-in-out infinite; }
.r-body { transform-origin: 50% 100%; animation: rBreath 3.2s ease-in-out infinite; }
.m-open { transform-origin: 50% 0; transform: scaleY(0); }
.speaking .m-open { transform: scaleY(var(--v)); }
.speaking { animation: jaw .9s steps(1) infinite; }
.lipsync .speaking { animation: none; }
@keyframes jaw { 0% { --v: .2; } 12% { --v: .9; } 24% { --v: .4; } 36% { --v: 1; } 48% { --v: .1; } 60% { --v: .8; } 72% { --v: .5; } 84% { --v: .95; } }
@keyframes hLook { 0%, 30%, 100% { transform: rotate(0); } 38%, 52% { transform: rotate(-5deg); } 60%, 74% { transform: rotate(4deg); } }
@keyframes rTail { from { transform: rotate(-8deg); } to { transform: rotate(10deg); } }
@keyframes rEar { 0%, 86%, 100% { transform: rotate(0); } 90% { transform: rotate(-14deg); } 95% { transform: rotate(8deg); } }
@keyframes rBreath { 50% { transform: scale(1.015, 1.03); } }
@keyframes lgA { 0%, 100% { transform: rotate(24deg); } 50% { transform: rotate(-24deg); } }
@keyframes lgB { 0%, 100% { transform: rotate(-24deg); } 50% { transform: rotate(24deg); } }
@keyframes rnA { 0%, 100% { transform: rotate(40deg); } 50% { transform: rotate(-36deg); } }
@keyframes rnB { 0%, 100% { transform: rotate(-36deg); } 50% { transform: rotate(40deg); } }
@keyframes amA { 0%, 100% { transform: rotate(-22deg); } 50% { transform: rotate(22deg); } }
@keyframes amB { 0%, 100% { transform: rotate(22deg); } 50% { transform: rotate(-22deg); } }
@keyframes amWave { from { transform: rotate(-150deg); } to { transform: rotate(-110deg); } }
@keyframes amTalk { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-40deg); } 60% { transform: rotate(-24deg); } }
@keyframes amUp { from { transform: rotate(-160deg); } to { transform: rotate(-120deg); } }
@keyframes amWork { from { transform: rotate(-110deg); } to { transform: rotate(-10deg); } }
@keyframes amHug { to { transform: rotate(-80deg); } }
@keyframes amGive { to { transform: rotate(-75deg); } }
@keyframes amThink { to { transform: rotate(-125deg); } }
@keyframes amKnock { 0%, 100% { transform: rotate(-90deg); } 50% { transform: rotate(-60deg); } }
@keyframes amFlap { from { transform: rotate(-35deg) scaleY(1); } to { transform: rotate(25deg) scaleY(.8); } }
@keyframes amCry { 0%, 100% { transform: rotate(-140deg); } 50% { transform: rotate(-130deg); } }
@keyframes hdNod { 0%, 100% { transform: rotate(0); } 40% { transform: rotate(5deg); } 70% { transform: rotate(-3deg); } }
@keyframes hdSing { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
@keyframes hdDown { to { transform: rotate(14deg) translateY(2px); } }
@keyframes hdEat { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(16deg); } }
@keyframes hdLaugh { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(-3deg) translateY(-1px); } }
@keyframes hdTurn { 0%, 35% { transform: rotate(0); } 45%, 80% { transform: rotate(-12deg); } 90%, 100% { transform: rotate(6deg); } }
@keyframes hdSleep { to { transform: rotate(18deg) translateY(3px); } }
@keyframes tlFast { from { transform: rotate(-24deg); } to { transform: rotate(24deg); } }
@keyframes lgTuck { 0%, 100% { transform: rotate(0); } 40% { transform: rotate(-40deg); } }
@keyframes lgSit { to { transform: rotate(-70deg); } }
@keyframes lgDance { 0%, 100% { transform: rotate(-18deg); } 50% { transform: rotate(14deg) translateY(-2px); } }
@keyframes lgStomp { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-28deg); } }

/* ---------- colouring room: paint with a finger, outlines stay on top ---------- */
.paintroom { position: fixed; inset: 0; z-index: 25; background: #fffaf2; display: flex; flex-direction: column; gap: 10px; color: #2a2440;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);

.round.dark { background: #efe6f3; color: #2a2440; backdrop-filter: none; }
.canvas { flex: 1; min-height: 0; display: grid; place-items: center; margin: 0 -6px; }
.paint-title { font-family: var(--display); font-size: 1rem; text-align: center; flex: 1; padding: 0 8px; line-height: 1.2; }
.brushes .ok-star { width: 58px; height: 58px; margin-left: 4px; }

@keyframes okPulse { 50% { transform: scale(1.14); box-shadow: 0 0 0 12px rgba(255, 211, 77, 0); } }
.alive { position: absolute; inset: 0; transform-origin: 50% 80%; }

@keyframes blinkMiss { from { opacity: 0; } to { opacity: 1; } }

/* ---------- chips, home strips ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 0 16px; padding-bottom: 4px; }
.chip { flex: none; padding: 10px 14px; border-radius: 999px; background: var(--card); color: var(--ink); font-weight: 700; font-size: .85rem; box-shadow: 0 3px 10px rgba(0,0,0,.1); }
.chip[aria-pressed="true"] { background: var(--moon); color: var(--on-moon); }
.strip { margin-bottom: 20px; }
.strip h3 { font-family: var(--display); font-size: 1rem; margin: 0 0 10px; }
.strip-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.mini { flex: none; width: 120px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.mini .art { width: 120px; height: 120px; border-radius: 18px; overflow: hidden; box-shadow: 0 6px 16px rgba(0,0,0,.2); }
.mini .art svg { width: 100%; height: 100%; display: block; }
.mini span { font-size: .8rem; font-weight: 600; line-height: 1.3; }

/* ---------- bottom tab bar ---------- */
.wrap { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 110px) !important; }
.tabs { position: fixed; z-index: 15; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--card); box-shadow: 0 -6px 24px rgba(0,0,0,.18);
  padding-top: 6px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
  padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px)); }

.tabs button svg { width: 26px; height: 26px; }
.tabs button[aria-pressed="true"] { color: var(--on-moon); background: var(--moon); }
.shelf-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 14px; }
.shelf-head h2 { font-family: var(--display); font-weight: 800; font-size: 1.3rem; margin: 0; text-wrap: balance; }
.shelf-head small { color: var(--muted); font-size: .8rem; flex: none; }

/* ---------- parent gate + paywall ---------- */
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(4, 6, 20, .7); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; max-height: 92%; overflow: auto;
  background: #fbf6ee; color: #2a2440;

  if (closed || MOOD === 'sleep') return `<path d="M${x - r} ${y} q${r} ${r * .9} ${r * 2} 0" ${O(1.9)} fill="none"/><path d="M${x - r + .5} ${y + .8} l-2 1.6 M${x + r - .5} ${y + .8} l2 1.6" ${O(1.4)}/>`;
  if (MOOD === 'happy' || MOOD === 'love') return `<path d="M${x - r} ${y + r * .3} q${r} ${-r * 1.7} ${r * 2} 0" ${O(2.1)} fill="none"/>`;
  if (MOOD === 'sad' || MOOD === 'angry') {
    const top = y - r * .15;
    return tear + `<path d="M${x - r * .9} ${top} h${r * 1.8} a${r * .9} ${r * .85} 0 0 1 ${-r * 1.8} 0z" fill="#fff" ${O(1.6)}/><circle cx="${x + .3}" cy="${top + r * .38}" r="${r * .44}" fill="#2a1f3a"/>

  const big = MOOD === 'surprised' || MOOD === 'scared' ? 1.22 : 1, pr = big > 1 ? .36 : .58;
  return `<g class="eye"><ellipse cx="${x}" cy="${y}" rx="${r * .86 * big}" ry="${r * big}" fill="#fff" ${O(1.6)}/><circle cx="${x + .7}" cy="${y + .7}" r="${r * pr}" fill="#2a1f3a"/><circle cx="${x + 1.7}" cy="${y - .9}" r="${r * .26}" fill="#fff"/><circle cx="${x - .4}" cy="${y + 1.9}" r="${r * .12}" fill="#fff"/></g>`;

const propBoxes = {};
function propFit(name, x, ground, h) {

  const b = propBoxes[name], s = Math.min(h / b.h, 1.4 * h / b.w + 1);
  return { svg: `<g transform="translate(${(x - (b.x + b.w / 2) * s).toFixed(1)} ${(ground - (b.y + b.h) * s).toFixed(1)}) scale(${s.toFixed(3)})">${body}</g>`, s, b };
}

    <g class="bpart" data-step="4"><path d="M0 -75 l12 3 l-12 2z" fill="#ff9f43" ${O(1.2)}/><path d="M-12 -64 q12 6 24 0 l2 6 q-14 6 -28 0z" fill="#e2445c" ${O(1.4)}/><path d="M8 -62 l4 14 l5 -2 l-4 -12z" fill="#e2445c" ${O(1.2)}/><path d="M-9 -86 h18 l-3 -12 h-12z" fill="#3a3550" ${O(1.4)}/><path d="M-14 -52 l-14 -10 M14 -52 l14 -10" stroke="#8a5a34" stroke-width="2.4" stroke-linecap="round"/></g>

const SEASON = text => /შემოდგომ|ფოთოლცვენ/.test(text) ? 'autumn' : /გაზაფხულ/.test(text) ? 'spring' : '';
// a paragraph's picture from its plan: place, time, weather, props
function scenery(q, tale, text, i) {
  const r = rnd(hashOf(tale.id) + i * 7 + 1);
  const pal = GREENS[hashOf(tale.id) % GREENS.length];
  const season = SEASON(text);
  const night = q.time === 'night', evening = q.time === 'evening';
  const P = { g: season === 'autumn' ? AUTUMN : pal, leaf: season === 'autumn' ? ['#f0a040', '#e07030'] : season === 'spring' ? ['#ffc0d8', '#ff9fc0'] : [pal[1], pal[2]], night, lit: night || evening, hearth: q.bg === 'hut' && (q.props || []).includes('hearth'), seed: hashOf(tale.id), bed: q.bg === 'room' && (q.props || []).includes('bed') };

  const whos = new Set([...(q.cast || []).map(k => PLANS[tale?.id]?.cast?.[k]?.who), ...Object.values(PLANS[tale?.id]?.cast || {}).map(c => c.who).filter(w => w === 'sun' || w === 'cloudy' || w === 'windy')]);

    const spec = PROP[name]; if (!spec) continue;
    const [, h, layer] = spec;

const AVATARS = ['hare', 'bear', 'fox', 'cat', 'owl', 'bun', 'hedgehog', 'duck'];
const profile = store.get('profile', { name: '', avatar: 'hare' });
const stickers = store.get('stickers', {});
const faceOf = (who, o = {}) => { const d = document.createElement('div'); d.innerHTML = `<svg viewBox="0 0 200 200"><g data-who>${C[who]({ ...o, anim: 'none' })}</g></svg>`; fitArt(d.firstElementChild); return d.innerHTML; };
function paintProfile() {
  $('avatar').innerHTML = faceOf(profile.avatar);
  $('helloLine').textContent = profile.name ? `გამარჯობა, ${profile.name}!` : 'გამარჯობა!';
}
function openProfile() {
  const got = TALES.filter(t => stickers[t.id]), pgot = PAGES.filter(pg => paintStickers[pg.id]);
  openSheet(`
    <h3>${profile.name ? profile.name + 'ს' : 'ჩემი'} გვერდი</h3>
    <input class="name-input" id="nameIn" maxlength="16" placeholder="სახელი" value="${profile.name.replace(/"/g, '')}" aria-label="სახელი">
    <p>აირჩიე შენი გმირი</p>
    <div class="avatars">${AVATARS.map(a => `<button data-av="${a}" aria-pressed="${a === profile.avatar}" aria-label="${a}">${faceOf(a)}</button>`).join('')}</div>
    <p><b>ზღაპრების სტიკერები:</b> ${got.length} / ${TALES.filter(ready).length}. ყოველი მოსმენილი ზღაპრისთვის — ახალი სტიკერი.</p>
    <div class="stickers">${got.map(t => `<div class="sticker" title="${t.title}">${faceOf(stickers[t.id])}</div>`).join('')}${Array.from({ length: Math.max(0, 8 - got.length) }, () => '<div class="sticker empty">?</div>').join('')}</div>
    <p><b>გაცოცხლებული სურათები:</b> ${pgot.length} / ${PAGES.length}. გააფერადე სურათი ბოლომდე და გააცოცხლე!</p>
    <div class="stickers">${pgot.map(pg => `<div class="sticker" title="${pg.title}">${stickerOfPage(pg)}</div>`).join('')}${Array.from({ length: Math.max(0, 4 - pgot.length) }, () => '<div class="sticker empty">?</div>').join('')}</div>
    <button class="cta" data-close>მზადაა</button>`);
  $('nameIn').oninput = e => { profile.name = e.target.value.trim(); store.set('profile', profile); paintProfile(); };
  $('sheet').onclick = e => {
    const av = e.target.closest('[data-av]');
    if (av) { profile.avatar = av.dataset.av; store.set('profile', profile); paintProfile(); $('sheet').querySelectorAll('[data-av]').forEach(b => b.setAttribute('aria-pressed', b === av)); }
    if (e.target.closest('[data-close]')) closeSheet();
  };
}
$('profileBtn').onclick = openProfile;
// the colouring page of a tale's hero, if there is one
function pageOfTale(t) {
  const whos = [taleHeroAny(t), ...Object.values(PLANS[t.id]?.cast || {}).map(c => c.who)].filter(Boolean);
  for (const w of whos) { const pg = PAGES.find(p => p.who === w || (w === 'natsar' && p.id === 'c2') || (w === 'princess' && p.o?.princess)); if (pg) return pg; }
  return null;
}
function giveSticker(t) {
  const fresh = !stickers[t.id], pg = pageOfTale(t);
  if (!fresh && !pg) return;
  const who = stickers[t.id] || taleHeroAny(t) || 'bun';
  if (fresh) { stickers[t.id] = who; store.set('stickers', stickers); }
  const el = document.createElement('div'); el.className = 'reward';
  el.innerHTML = `<div class="reward-card">${fresh ? `<div class="sticker">${faceOf(who)}</div><h3>ახალი სტიკერი!</h3><p>${profile.name ? profile.name + ', ' : ''}შენ მოისმინე „${t.title}“</p>` : `<h3>„${t.title}“ დასრულდა!</h3>`}
    ${pg ? `<button class="cta" data-paint style="width:100%;background:#3aa860">🎨 გააფერადე: ${pg.title}</button>` : ''}
    <button class="cta" data-ok style="width:100%">${fresh ? 'ვაშა!' : 'კარგი'}</button></div>`;
  document.body.appendChild(el); if (fresh) chime();
  el.onclick = e => {
    if (e.target.closest('[data-paint]')) { el.remove(); $('closePlayer').onclick(); if (pg.free || testMode) openPage(pg); else gate(paywall); return; }
    if (e.target.closest('[data-ok]') || e.target === el) el.remove();
  };
  return true;
}
// a sticker for every picture brought to life
function givePaintSticker(pg) {
  if (paintStickers[pg.id]) return;
  paintStickers[pg.id] = 1; store.set('paintStickers', paintStickers);
  setTimeout(() => {
    const el = document.createElement('div'); el.className = 'reward';
    el.innerHTML = `<div class="reward-card"><div class="sticker">${stickerOfPage(pg)}</div><h3>ახალი სტიკერი!</h3><p>${profile.name ? profile.name + ', ' : ''}შენ გააცოცხლე „${pg.title}“</p><button class="cta" style="width:100%">ვაშა!</button></div>`;
    document.body.appendChild(el); chime(); el.onclick = () => el.remove();
  }, 2600);
}
const paintStickers = store.get('paintStickers', {});
const stickerOfPage = pg => { const d = document.createElement('div'); d.innerHTML = pageSvg(pg); fitArt(d.firstElementChild); return d.innerHTML; };

// ---------- mode: cartoon by day, bedtime at night ----------
const hour = new Date().getHours();
// each section is its own world: bedtime tales are calm and dark, the rest bright cartoons
let mode = 'day';
function setMode(m) { mode = m; document.documentElement.classList.toggle('day', m === 'day'); }

// ---------- timings: when each paragraph (scene) starts, and how long the tale is ----------
let TIMINGS = {};
const minutes = id => { const d = TIMINGS[id]?.duration; return d ? `${Math.max(1, Math.round(d / 60))} წთ` : ''; };

// ---------- home shelves ----------
let tab = store.get('tab', 'ge');
setMode(tab === 'sleep' ? 'night' : 'day');
function setTab(t) { tab = t; store.set('tab', t); setMode(t === 'sleep' ? 'night' : 'day'); $('tabs').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === t)); renderShelves(); window.scrollTo(0, 0); }
$('tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); };
const coverWatch = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle('live', e.isIntersecting)), { rootMargin: '80px' }) : null;
function watchCovers() { document.querySelectorAll('#shelves .tile .art, #shelves .daily').forEach(el => coverWatch ? coverWatch.observe(el) : el.classList.add('live')); }
function renderShelves() {
  $('testPill').hidden = !testMode;
  $('tabs').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === tab));
  if (tab === 'paint') {
    // one big mixed album: every child colours whatever they like
    const groups = ['girls', 'boys', 'tales'].map(c => PAGES.filter(pg => pg.cat === c));
    const shown = Array.from({ length: Math.max(...groups.map(g => g.length)) }, (_, i) => groups.map(g => g[i])).flat().filter(Boolean);
    const free = shown.filter(pg => pg.free), rest = shown.filter(pg => !pg.free);
    $('shelves').innerHTML = `<div class="shelf-head"><h2>გააფერადე და გააცოცხლე!</h2><small>${PAGES.length} სურათი</small></div>
      <div class="grid">${[...free, ...rest].map(pg => `
        <button class="tile page ${pg.free || testMode ? '' : 'locked'}" data-page="${pg.id}" aria-label="${pg.title}">
          <div class="art">${pageThumb(pg)}</div>
          ${pg.free ? '<span class="badge free">უფასო</span>' : testMode ? '' : `<span class="badge">${LOCK}</span>`}
          <span class="name">${pg.title}</span>
        </button>`).join('')}</div>`;
    return;
  }
  const sh = SHELVES.find(x => x.cat === tab);
  const list = TALES.filter(t => t.cat === tab);
  const strip = (title, items) => items.length ? `<div class="strip"><h3>${title}</h3><div class="strip-row">${items.map(t => `<button class="mini" data-id="${t.id}" aria-label="${t.title}"><div class="art">${cover(t)}</div><span>${t.title}</span></button>`).join('')}</div></div>` : '';
  const going = list.filter(t => open_(t) && positions[t.id] > 8);
  const loved = list.filter(t => open_(t) && favs[t.id]);
  const pool = list.filter(open_);
  const today = pool.length ? pool[Math.floor(Date.now() / 864e5) % pool.length] : null;
  const daily = today ? `<button class="daily" data-id="${today.id}" aria-label="დღის ზღაპარი: ${today.title}">${cover(today)}<span class="tag">დღის ზღაპარი</span><span class="info"><b>${today.title}</b><span class="go">${PLAY}</span></span></button>` : '';
  $('shelves').innerHTML = daily + strip('გააგრძელე მოსმენა', going) + strip('რჩეული', loved) + `<div class="shelf-head"><h2>${sh.title}</h2><small>${list.filter(ready).length} ზღაპარი · ${sh.note}</small></div>
      <div class="grid">${list.map(t => `
        <button class="tile ${open_(t) ? '' : 'locked'}" data-id="${t.id}" aria-label="${t.title}">
          <div class="art">${cover(t)}</div>
          ${!ready(t) ? '<span class="badge soon">მალე</span>' : t.free ? '<span class="badge free">უფასო</span>' : testMode ? '' : `<span class="badge">${LOCK}</span>`}
          <span class="name">${t.title}</span>
          <span class="len">${ready(t) ? minutes(t.id) : 'მზადდება'}${listened[t.id] ? ' · <b class="done">მოსმენილია</b>' : ''}</span>
        </button>`).join('')}</div>`;
  watchCovers();
}
$('shelves').addEventListener('click', e => {
  const chip = e.target.closest('[data-pcat]'); if (chip) { paintCat = chip.dataset.pcat; store.set('paintCat', paintCat); return renderShelves(); }
  const tile = e.target.closest('.tile, .mini, .daily'); if (!tile) return;
  if (tile.dataset.page) { const pg = PAGES.find(x => x.id === tile.dataset.page); return pg.free || testMode ? openPage(pg) : gate(paywall); }
  const t = TALES.find(x => x.id === tile.dataset.id);
  if (!ready(t)) return toast('ეს ზღაპარი მალე დაემატება');
  open_(t) ? openPlayer(t) : gate(paywall);
});

// R1 rig: boy (+ natsar, brother, man), mom (+ princess look, stepmother frown), girl (+ redhood), granny (+ witch).
// Back parts first, front parts last; every moving part is its own top-level group with its pivot set explicitly.
const r1_f = v => +v.toFixed(2);
const r1_SHADE = (d, op = .15) => `<path d="${d}" fill="#2a1840" opacity="${op}"/>`;
const r1_SHINE = (d, op = .35) => `<path d="${d}" fill="#fff" opacity="${op}"/>`;
// pivot inline style from a part's geometric box [x0, y0, x1, y1] and the wanted pivot point
const r1_org = (b, px, py) => `style="transform-origin:${r1_f((px - b[0]) / (b[2] - b[0]) * 100)}% ${r1_f((py - b[1]) / (b[3] - b[1]) * 100)}%"`;
const r1_box = (...bs) => bs.reduce((a, b) => [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[2], b[2]), Math.max(a[3], b[3])]);
// a tapered capsule from (sx,sy) radius rs to (wx,wy) radius rw
const r1_limb = (sx, sy, wx, wy, rs, rw) => {
  const dx = wx - sx, dy = wy - sy, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L, f = r1_f;
  return `M${f(sx + nx * rs)} ${f(sy + ny * rs)} L${f(wx + nx * rw)} ${f(wy + ny * rw)} A${rw} ${rw} 0 0 0 ${f(wx - nx * rw)} ${f(wy - ny * rw)} L${f(sx - nx * rs)} ${f(sy - ny * rs)} A${rs} ${rs} 0 0 0 ${f(sx + nx * rs)} ${f(sy + ny * rs)}z`;
};
// geometric boxes of the HOLD items (they sit around the near hand at 43,59)

    <path d="M${f(sx + nx * rs * .5 + ux * 3)} ${f(sy + ny * rs * .5 + uy * 3)} L${f(wx + nx * rw * .5 - ux * 4)} ${f(wy + ny * rw * .5 - uy * 4)}" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".32"/>
    ${o.cuff ? `<path d="M${f(cx + nx * rw * 1.05)} ${f(cy + ny * rw * 1.05)} L${f(cx - nx * rw * 1.05)} ${f(cy - ny * rw * 1.05)}" stroke="${o.cuff}" stroke-width="2.6" stroke-linecap="round"/>` : `<path d="M${f(cx + nx * rw)} ${f(cy + ny * rw)} L${f(cx - nx * rw)} ${f(cy - ny * rw)}" ${O(1.2)} opacity=".45"/>`}

// R2 rig: grandpa, king, prince, fairy, devi (with o.cap), snowman.
// Back parts first, front parts last; every moving part is its own top-level group with an explicit pivot
// (transform-box:view-box + transform-origin in the character's own coordinates, so a held item never moves the pivot).
const r2_SH = (d, op = .15) => `<path d="${d}" fill="#2a1840" opacity="${op}"/>`;

const r2_open = (cx, y, w, col = '#7a3a4a', sw = 1.3) => `<g class="m-open"><path d="M${cx - w} ${y} Q${cx} ${y - w * .25} ${cx + w} ${y} Q${cx + w * .95} ${y + w * 1.3} ${cx} ${y + w * 1.4} Q${cx - w * .95} ${y + w * 1.3} ${cx - w} ${y}z" fill="${col}" ${O(sw)}/><ellipse cx="${cx}" cy="${y + w * 1.02}" rx="${w * .52}" ry="${w * .3}" fill="#ff8fa8"/></g>`;

const r2_mouth = (cx, y, w, sad, col = '#7a3a4a') => `<g class="r-mouth"><path d="M${cx - w} ${y} q${w} ${sad ? -w * .45 : w * .75} ${w * 2} 0" ${O(1.5)} fill="${sad ? 'none' : col}"/>${r2_open(cx, y, w * .95, col)}</g>`;

// ---------------------------------------------------------------- lion: golden body, big scalloped mane
const r3_mane = (cx, cy, r, n, bump) => { let d = ''; for (let i = 0; i <= n; i++) { const a = i / n * Math.PI * 2, x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
  if (!i) d += `M${x.toFixed(1)} ${y.toFixed(1)}`; else { const m = (i - .5) / n * Math.PI * 2; d += ` Q${(cx + Math.cos(m) * (r + bump)).toFixed(1)} ${(cy + Math.sin(m) * (r + bump)).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)}`; } } return d + 'z'; };

  return shadow(42, 71, 34) + `
    <g class="r-tail" style="transform-origin:96% 94%"><path d="M11 41 Q-6 36 -2 19" stroke="${INK}" stroke-width="5.4" fill="none" stroke-linecap="round"/><path d="M11 41 Q-6 36 -2 19" stroke="${Y}" stroke-width="3" fill="none" stroke-linecap="round"/>

    ${leg('r-leg2', 33, 0)}${leg('r-leg1', 65, 0)}
    <g class="r-head" style="transform-origin:30% 82%">
      <path d="${r3_mane(70, 29, 18.5, 13, 9)}" fill="${M}" ${O(1.8)}/>
      ${r3_SH(r3_mane(73, 32, 15, 11, 6), .14)}
      <path d="M54 22 q-4 -3 -5 -7 M62 10 q-1 -3 0 -5 M80 9 q2 -2 4 -2 M89 24 q3 -1 5 0 M52 38 q-3 1 -5 4" stroke="#e8964a" stroke-width="1.8" opacity=".9" fill="none" stroke-linecap="round"/>

// --- part 4 ---
// R4 rig: dog, cat, mouse, sheep, goat, cow, bull, horse (+donkey, unicorn), pig (+kitten picture).
// Back parts first, front parts last; every moving part is its own top-level group (legs, tail, body, head).
// Four legs: near-front + far-back = r-leg1, far-front + near-back = r-leg2. Legs start inside the body (hip pivot hidden).
const r4_SH = (d, op = .14) => `<path d="${d}" fill="#2a1840" opacity="${op}"/>`;
const r4_SN = (d, op = .32) => `<path d="${d}" fill="#fff" opacity="${op}"/>`;
// one leg: rounded column from y0 (hidden in the body) to y1 (ground), with a paw or a hoof
const r4_leg = (cls, x, y0, y1, w, fill, foot, kind = 'paw', far = false) => {
  const h = y1 - y0, l = x - w / 2;
  let ft;
  if (kind === 'paw') {
    const ry = Math.max(1.5, w * .28), rx = w / 2 + w * .12;
    ft = `<ellipse cx="${x + w * .12}" cy="${y1 - ry}" rx="${rx}" ry="${ry}" fill="${foot}" ${O(Math.min(1.5, w * .26))}/>` +
      (w > 5 ? `<path d="M${x + w * .02} ${y1 - ry * 1.4} v${ry * .8} M${x + w * .34} ${y1 - ry * 1.4} v${ry * .8}" ${O(.9)} opacity=".55"/>` : '');
  } else {
    const hh = w * .45;
    ft = `<path d="M${l - .3} ${y1 - hh} h${w + .6} v${hh - 1.2} q0 1.2 -1.2 1.2 h${-(w - 1.8)} q-1.2 0 -1.2 -1.2z" fill="${foot}" ${O(1.5)}/>` + r4_SN(`M${l + 1} ${y1 - hh + .9} h${w * .45} v${hh * .35} h${-w * .45}z`, .3);
  }
  return `<g class="${cls}"><rect x="${l}" y="${y0}" width="${w}" height="${h - 1}" rx="${w / 2}" fill="${fill}" ${O(w > 5 ? 1.8 : 1.3)}/>` +
    r4_SH(`M${x + w * .12} ${y0 + 3} h${w * .3} v${h - 7} q${-w * .15} 1.2 ${-w * .3} .6z`, .16) +
    (far ? `<rect x="${l}" y="${y0}" width="${w}" height="${h - 1}" rx="${w / 2}" fill="#2a1840" opacity=".12"/>` : '') + ft + `</g>`;
};
// talking mouth: closed drawing + open mouth (scales down from its top edge)
const r4_mouth = (closed, x, y, w, d, fill = '#7a3a4a') => `<g class="r-mouth">${closed}<g class="m-open"><path d="M${x - w / 2} ${y} q${w / 2} -1 ${w} 0 q0 ${d} ${-w / 2} ${d + .4} q${-w / 2} -.4 ${-w / 2} ${-d}z" fill="${fill}" ${O(Math.min(1.3, w * .22))}/><ellipse cx="${x}" cy="${y + d * .7}" rx="${w * .27}" ry="${d * .2}" fill="#ff8fa8"/></g></g>`;

// ---------------- cat ----------------

// --- part 5 ---
// R5: rigged birds — bird (+ goldbird, dove, quail), crow, eagle, owl, gull, crane.
// Each moving part is its own top-level group; wings/legs/tail/head carry their exact pivot (computed from the part's outline).
const r5_SH = (d, op = .16) => `<path d="${d}" fill="#2a1840" opacity="${op}"/>`;
const r5_SN = (d, op = .32) => `<path d="${d}" fill="#fff" opacity="${op}"/>`;
// bounding box of absolute paths (M L Q C Z) and [cx, cy, rx, ry] ellipses
const r5_bb = shapes => {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  const add = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
  for (const s of shapes) {
    if (typeof s !== 'string') { const [cx, cy, rx, ry = rx] = s; add(cx - rx, cy - ry); add(cx + rx, cy + ry); continue; }
    const t = s.match(/[MLQCZ]|-?\d*\.?\d+/g); let i = 0, cmd = 'M', px = 0, py = 0, sx = 0, sy = 0;
    const n = () => +t[i++];
    while (i < t.length) {
      if (/[MLQCZ]/.test(t[i])) cmd = t[i++];
      if (cmd === 'Z') { px = sx; py = sy; continue; }
      if (cmd === 'M' || cmd === 'L') { px = n(); py = n(); add(px, py); if (cmd === 'M') { sx = px; sy = py; cmd = 'L'; } }
      else if (cmd === 'Q') { const a = n(), b = n(), x = n(), y = n(); for (let k = 1; k <= 24; k++) { const u = k / 24, v = 1 - u; add(v * v * px + 2 * u * v * a + u * u * x, v * v * py + 2 * u * v * b + u * u * y); } px = x; py = y; }
      else if (cmd === 'C') { const a = n(), b = n(), c = n(), d = n(), x = n(), y = n(); for (let k = 1; k <= 32; k++) { const u = k / 32, v = 1 - u; add(v * v * v * px + 3 * v * v * u * a + 3 * v * u * u * c + u * u * u * x, v * v * v * py + 3 * v * v * u * b + 3 * v * u * u * d + u * u * u * y); } px = x; py = y; }
      else i++;
    }
  }
  return [x0, y0, x1, y1];
};
// a part group whose pivot is the absolute point (px, py)
const r5_g = (cls, shapes, px, py, inner) => {
  const [x0, y0, x1, y1] = r5_bb(shapes);
  return `<g class="${cls}" style="transform-origin:${((px - x0) / (x1 - x0) * 100).toFixed(1)}% ${((py - y0) / (y1 - y0) * 100).toFixed(1)}%">${inner}</g>`;
};
// a bird leg: shank from (x, top) to the foot at y = bot, toes forward; col = leg colour, w = thickness
const r5_leg = (cls, x, top, bot, col, w = 1.2, s = 1) => {
  const d = `M${x} ${top} L${x} ${bot - .4 * s} M${x - 2 * s} ${bot} L${x} ${bot - .9 * s} L${x + 3.2 * s} ${bot} M${x} ${bot - .9 * s} L${x + 1.4 * s} ${bot + .1}`;
  return r5_g(cls, [`M${x - 2 * s} ${top} L${x + 3.2 * s} ${bot + .1}`], x, top,
    `<path d="${d}" stroke="${INK}" stroke-width="${w + 1.5}" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`);
};

const r6_ln = (d, col, w) => `<path d="${d}" stroke="${INK}" stroke-width="${w + 2.2}" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;

const r7_SH = (d, op = .16) => `<path d="${d}" fill="#2a1840" opacity="${op}"/>`;
const r7_SN = (d, op = .35) => `<path d="${d}" fill="#fff" opacity="${op}"/>`;
// a thin insect limb: ink outline under a coloured core
const r7_limb = (d, col, w = 1.6) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + 1.5}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
// mouth: closed smile + open mouth (dark half-moon with a pink tongue), w = half width
const r7_mouth = (x, y, w, line = INK, lw = 1.3) => `<g class="r-mouth"><path d="M${x - w} ${y} q${w} ${w * .75} ${w * 2} 0" fill="none" stroke="${line}" stroke-width="${lw}" stroke-linecap="round"/>
  <g class="m-open"><path d="M${x - w * .95} ${y - .2} q${w * .95} ${w * .35} ${w * 1.9} 0 q-.1 ${w * 1.5} ${-w * .95} ${w * 1.6} q${-w * .85} -.1 ${-w * .95} ${-w * 1.6}z" fill="#7a3a4a" ${O(Math.min(1.2, w * .6))}/><ellipse cx="${x}" cy="${y + w * 1.05}" rx="${w * .5}" ry="${w * .28}" fill="#ff8fa8"/></g></g>`;
const r7_knob = (x, y, r, c) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" ${O(1)}/>`;

const r8_SHADE = (d, op = .14) => `<path d="${d}" fill="#2a1840" opacity="${op}"/>`;
const r8_SHINE = (d, op = .35) => `<path d="${d}" fill="#fff" opacity="${op}"/>`;

const r8_mouth = (x, y, w, o, lip = '#7a3a4a') => `<g class="r-mouth">
  <path d="M${x - w} ${y} q${w} ${o.sad ? -w * .5 : w * .8} ${w * 2} 0" ${O(1.5)} fill="${o.sad ? 'none' : lip}"/>
  <g class="m-open"><path d="M${x - w * .95} ${y} q${w * .95} -${w * .2} ${w * 1.9} 0 q0 ${w * 1.25} -${w * .95} ${w * 1.35} q-${w * .95} -${w * .1} -${w * .95} -${w * 1.35}z" fill="${lip}" ${O(1.3)}/>
  <ellipse cx="${x}" cy="${y + w * .95}" rx="${w * .5}" ry="${w * .27}" fill="#ff8fa8"/></g></g>`;
// a little arm: rounded sleeve hanging down from (x, y), length len, with a round hand
const r8_arm = (cls, x, y, len, fill, hand, w = 3) => `<g class="${cls}">
  <path d="M${x - w} ${y} C${x - w * 1.4} ${y + len * .6} ${x - w} ${y + len} ${x} ${y + len} C${x + w} ${y + len} ${x + w * 1.4} ${y + len * .6} ${x + w} ${y} A${w} ${w} 0 0 0 ${x - w} ${y}z" fill="${fill}" ${O(1.6)}/>${r8_SHADE(`M${x + w * .3} ${y + 1} C${x + w} ${y + len * .5} ${x + w * .8} ${y + len - 1} ${x} ${y + len - .4}z`, .12)}
  <circle cx="${x}" cy="${y + len + .6}" r="${w + .4}" fill="${hand}" ${O(1.4)}/>${r8_SHINE(`M${x - w * .6} ${y + len - .2} q${w * .33} -${w * .5} ${w * .9} -${w * .43}`, .55)}</g>
`;

    <div class="row"><span>ზღაპრები ზედიზედ<br><small style="color:#7a7290">ერთი რომ დამთავრდება, შემდეგი დაიწყება</small></span>
      <button class="switch" id="chainSw" role="switch" aria-checked="${chain}" aria-label="ზღაპრები ზედიზედ"></button></div>
    <div class="row"><span>ძილის ტაიმერი<br><small style="color:#7a7290">ხმა ნელა ჩაქრება და ზღაპარი გაჩერდება</small></span></div>
    <div class="answers" id="timer">${[0, 15, 30, 45].map(m => `<button data-min="${m}" style="font-size:1rem;height:52px;${m === sleepMin ? 'background:#c2577a;color:#fff' : ''}">${m ? m + ' წთ' : 'გამორთ.'}</button>`).join('')}</div>
    <div class="row"><span>მუსიკა<br><small style="color:#7a7290">ნაზი მელოდია ზღაპრის დროს</small></span>
      <button class="switch" id="musicSw" role="switch" aria-checked="${musicOn}" aria-label="მუსიკა"></button></div>
    <div class="row"><span>ხმოვანი ეფექტები<br><small style="color:#7a7290">ჩიტები, ტალღები, ნაბიჯები და შეხების ხმა</small></span>
      <button class="switch" id="soundSw" role="switch" aria-checked="${sounds}" aria-label="ხმოვანი ეფექტები"></button></div>
    <div class="row"><span>სატესტო რეჟიმი<br><small style="color:#7a7290">ყველა ზღაპარი ღიაა გადახდის გარეშე</small></span>
      <button class="switch" id="testSw" role="switch" aria-checked="${testMode}" aria-label="სატესტო რეჟიმი"></button></div>
    <p style="font-size:.72rem;color:#7a7290;line-height:1.4;margin:6px 0 10px">მუსიკა: ${MUSIC_CREDITS}</p>
    <button class="cta" data-sub>გამოწერა — 3 დღე უფასოდ</button>
    <button class="link" data-close>დახურვა</button>`);
  $('sheet').onclick = e => {
    if (e.target.closest('[data-close]')) return closeSheet();
    if (e.target.closest('#chainSw')) { chain = !chain; store.set('chain', chain); $('chainSw').setAttribute('aria-checked', chain); }
    if (e.target.closest('#soundSw')) { sounds = !sounds; store.set('sounds', sounds); $('soundSw').setAttribute('aria-checked', sounds); if (!sounds) ambStop(); }
    if (e.target.closest('#musicSw')) { musicOn = !musicOn; store.set('music', musicOn); $('musicSw').setAttribute('aria-checked', musicOn); paintMusicBtn(); musicLevel(1); }
    if (e.target.closest('#testSw')) { testMode = !testMode; store.set('test', testMode); $('testSw').setAttribute('aria-checked', testMode); renderShelves(); }
    const m = e.target.closest('[data-min]');
    if (m) { sleepMin = +m.dataset.min; store.set('sleepMin', sleepMin); sleepAt = 0; $('timer').querySelectorAll('button').forEach(b => { const on = +b.dataset.min === sleepMin; b.style.background = on ? '#c2577a' : ''; b.style.color = on ? '#fff' : ''; }); }
    if (e.target.closest('[data-sub]')) paywall();
  };
});

function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 3200);
}
</script>
